<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Plate</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ece1c8; }
  canvas { display: block; width: 100vw; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 58px; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; box-sizing: border-box; background: #e8dcc1; border-top: 1px solid #c9b894;
    font: 500 15px "Cormorant Garamond", Georgia, serif; color: #24180d; }
  #bar button { font: 600 15px "Cormorant Garamond", Georgia, serif; color: #24180d; background: #f6eedb;
    border: 1px solid #b9a682; border-radius: 3px; padding: 5px 12px; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: #24180d; color: #f6eedb; border-color: #24180d; }
  #play { min-width: 70px; }
  #track { position: relative; flex: 1; height: 34px; min-width: 120px; }
  #marks { position: absolute; left: 7px; right: 7px; top: 3px; height: 10px; }
  #marks i { position: absolute; top: 0; width: 4px; height: 10px; margin-left: -2px; border-radius: 1px; cursor: pointer; }
  #marks i.tw { top: 1px; width: 3px; height: 8px; transform: rotate(45deg); }
  #scrub { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0; accent-color: #9b2a1f; }
  #stepv { min-width: 112px; text-align: right; font-style: italic; color: #5a4430; }
  @media (max-width: 700px) { #bar { gap: 6px; padding: 0 8px; } #bar button { padding: 4px 7px; } #stepv { min-width: 0; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated entomology plate replaying a real simulation run: fly 813 asks a shared memory about smells, beside its twin that lives alone."></canvas>
<div id="bar">
  <button id="play">Play</button>
  <button data-rate="1" aria-pressed="true">1x</button>
  <button data-rate="2" aria-pressed="false">2x</button>
  <button data-rate="4" aria-pressed="false">4x</button>
  <button id="mode" aria-pressed="true" title="Highlights moves quickly between events and slows down for them">Highlights</button>
  <div id="track"><div id="marks"></div><input type="range" id="scrub" min="0" max="1000" step="0.1" value="0" aria-label="Scrub through the run"></div>
  <span id="stepv">step 0 of 400</span>
</div>
<script src="story.js"></script>
<script>
(() => {
'use strict';
// ============================================================ helpers
const TAU = Math.PI * 2;
const W0 = 1600, H0 = 1000;          // plate (world) size
const DT = 1 / 240;                   // simulation step
const FS = 1.45;                       // fly units -> world units
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = t => (t = clamp(t, 0, 1), t * t * (3 - 2 * t));
const sstep5 = t => (t = clamp(t, 0, 1), t * t * t * (t * (t * 6 - 15) + 10));
const easeIO = t => 0.5 - 0.5 * Math.cos(Math.PI * clamp(t, 0, 1));
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const mod = (a, n) => ((a % n) + n) % n;
const deg = d => d * Math.PI / 180;
const win = (t, a, b, fi, fo) => clamp(Math.min((t - a) / fi, (b - t) / fo), 0, 1);
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function closedSpline(c, p) {
  const n = p.length;
  c.moveTo(p[0][0], p[0][1]);
  for (let i = 0; i < n; i++) {
    const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  c.closePath();
}
function openSpline(c, p, move = true) {
  const n = p.length;
  if (move) c.moveTo(p[0][0], p[0][1]);
  for (let i = 0; i < n - 1; i++) {
    const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(n - 1, i + 2)];
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
}
// half outline from front centre, down the left (-y) side, to the back centre -> full loop
function mirror(half) {
  const back = half.slice(1, -1).reverse().map(([x, y]) => [x, -y]);
  return half.concat(back);
}
function jitter(pts, r, amp) { return pts.map(([x, y]) => [x + (r() - 0.5) * 2 * amp, y + (r() - 0.5) * 2 * amp]); }
function inPoly(pts, x, y) {
  let ins = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
// tapered limb segment outline (adds to current path)
function segPath(c, a, b, w0, wm, w1) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1e-6;
  const nx = -dy / l, ny = dx / l, ang = Math.atan2(ny, nx);
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const k = wm - (w0 + w1) / 4;
  c.moveTo(a[0] + nx * w0 / 2, a[1] + ny * w0 / 2);
  c.quadraticCurveTo(mx + nx * k, my + ny * k, b[0] + nx * w1 / 2, b[1] + ny * w1 / 2);
  c.arc(b[0], b[1], w1 / 2, ang, ang - Math.PI, true);
  c.quadraticCurveTo(mx - nx * k, my - ny * k, a[0] - nx * w0 / 2, a[1] - ny * w0 / 2);
  c.arc(a[0], a[1], w0 / 2, ang + Math.PI, ang, true);
  c.closePath();
}

// ============================================================ palette
const INK = '#24180d', SEPIA = '#5a4430', RED = '#9b2a1f', PAPER = '#efe5cd';
const COL = {
  leg: '#bb8c56', legD: '#6e4826', legHi: 'rgba(255,238,205,0.55)',
  thx0: '#e3b779', thx1: '#b8824a', thx2: '#7a4f28',
  abd0: '#ecca93', abd1: '#c79a5e', abd2: '#8e6338', band: '#37241430',
};
const APPLE = { x: 40, y: 0, rot: 0, s: 0.85 };
const SPIDER = { x: 0, y: 0, h: 0, s: 1.12 };
// ============================================================ fly drawing (fly units)
const THX = mirror([[27, 0], [25.6, -6.8], [21, -12.4], [13, -16], [3, -17], [-7, -16], [-13.5, -12.5], [-16.8, -6.5], [-17.5, 0]]);
const SCU = mirror([[-12.2, 0], [-12.8, -9.6], [-17.2, -9.6], [-22.4, -7], [-25.4, -3.2], [-26.3, 0]]);
const ABD = mirror([[-12, 0], [-12.8, -9.5], [-17.5, -15.8], [-26, -19.2], [-38, -19.9], [-50, -17.6], [-59.5, -12.5], [-65.5, -6.6], [-68.4, 0]]);
const HEAD = mirror([[39.8, 0], [39, -6.6], [36.4, -12.8], [31.6, -17.6], [25.6, -18.6], [21.4, -15.4], [20.4, -8], [22.6, 0]]);
const WL = 84;
const WOUT = [[0, 0], [0.08, 0.042], [0.2, 0.072], [0.35, 0.098], [0.5, 0.118], [0.65, 0.133], [0.78, 0.137], [0.88, 0.124], [0.95, 0.097], [0.99, 0.057], [1.0, 0.018],
  [0.99, -0.035], [0.955, -0.095], [0.89, -0.15], [0.8, -0.192], [0.68, -0.215], [0.55, -0.218], [0.42, -0.2], [0.3, -0.165], [0.2, -0.122], [0.145, -0.09], [0.118, -0.068], [0.09, -0.08], [0.05, -0.062], [0.018, -0.03]]
  .map(([u, v]) => [u * WL, v * WL]);
const VEINS = {
  C:   [[0.0, 0.004], [0.08, 0.04], [0.2, 0.07], [0.35, 0.096], [0.5, 0.116], [0.65, 0.131], [0.78, 0.135], [0.88, 0.122], [0.95, 0.095], [0.99, 0.055], [0.998, 0.015], [0.985, -0.045], [0.968, -0.08]],
  Sc:  [[0.03, 0.018], [0.12, 0.048], [0.22, 0.07]],
  L1:  [[0.03, 0.014], [0.15, 0.048], [0.3, 0.079], [0.42, 0.102]],
  L2:  [[0.045, 0.01], [0.2, 0.03], [0.4, 0.058], [0.6, 0.094], [0.73, 0.122], [0.8, 0.134]],
  L3:  [[0.045, 0.005], [0.25, 0.012], [0.5, 0.02], [0.75, 0.034], [0.92, 0.038], [0.997, 0.028]],
  L4:  [[0.035, -0.004], [0.2, -0.029], [0.42, -0.051], [0.63, -0.067], [0.82, -0.077], [0.968, -0.08]],
  L5:  [[0.03, -0.011], [0.15, -0.044], [0.35, -0.088], [0.55, -0.128], [0.7, -0.163], [0.795, -0.19]],
  L6:  [[0.03, -0.019], [0.1, -0.05], [0.185, -0.08]],
  acv: [[0.425, 0.0155], [0.427, -0.052]],
  pcv: [[0.645, -0.068], [0.63, -0.1], [0.605, -0.137]],
  hcv: [[0.075, 0.042], [0.08, 0.02]],
  bcv: [[0.135, 0.008], [0.14, -0.04]],
};
for (const k in VEINS) VEINS[k] = VEINS[k].map(([u, v]) => [u * WL, v * WL]);

// compound eye facets: hex grid in angle space, projected onto a dome (ellipse rx x ry)
const EYE = { cx: 29.8, cy: 11.5, rx: 9.6, ry: 7.4, rot: 0.1 };
const FACETS = (() => {
  const p = new Path2D(), glints = [];
  const a = 0.1, R = Math.PI / 2;
  const proj = (x, y) => { let r = Math.hypot(x, y); if (r > R) { x *= R / r; y *= R / r; r = R; } const k = r < 1e-6 ? 1 : Math.sin(r) / r; return [x * k * EYE.rx, y * k * EYE.ry]; };
  for (let i = -20; i <= 20; i++) for (let j = -20; j <= 20; j++) {
    const cx = 1.5 * a * i, cy = Math.sqrt(3) * a * (j + 0.5 * (i & 1));
    if (Math.hypot(cx, cy) > R * 0.985) continue;
    for (let q = 0; q < 6; q++) {
      const [x, y] = proj(cx + a * Math.cos(q * Math.PI / 3), cy + a * Math.sin(q * Math.PI / 3));
      q ? p.lineTo(x, y) : p.moveTo(x, y);
    }
    p.closePath();
    glints.push(proj(cx, cy));
  }
  return { p, glints };
})();

function legPts(k, Lg) {
  const L = LEGDEF[k], hx = L.hip[0], hy = L.hip[1], lift = Lg.lift || 0;
  const cx = Lg.x, cy = Lg.y;
  let ux, uy;
  if (Lg.td) { ux = Lg.td[0]; uy = Lg.td[1]; }
  else { ux = cx - hx; uy = cy - hy; const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l; }
  const ts = L.ts * (1 - 0.16 * lift);
  let ax = cx - ux * ts, ay = cy - uy * ts;
  let vx = ax - hx, vy = ay - hy; const vl = Math.hypot(vx, vy) || 1; vx /= vl; vy /= vl;
  const c0 = [hx, hy], c1 = [hx + vx * 4.5, hy + vy * 4.5];
  // two-bone IK, knee bends away from the body midline
  let dx = ax - c1[0], dy = ay - c1[1], d = Math.hypot(dx, dy) || 1e-3;
  const dc = clamp(d, Math.abs(L.f - L.t) + 0.5, L.f + L.t - 0.05);
  const a = (L.f * L.f - L.t * L.t + dc * dc) / (2 * dc), hh = Math.sqrt(Math.max(0, L.f * L.f - a * a));
  const nx = dx / d, ny = dy / d;
  const mx = c1[0] + nx * a, my = c1[1] + ny * a;
  const k1 = [mx - ny * hh, my + nx * hh], k2 = [mx + ny * hh, my - nx * hh];
  const knee = (k1[1] * L.side > k2[1] * L.side) ? k1 : k2;
  const ankle = [c1[0] + nx * dc, c1[1] + ny * dc];
  return { c0, c1, knee, ankle, claw: [cx, cy], lift };
}

function flyShadow(c, F) {
  const [sx, sy] = F.shOff, k = 1 + F.bob * 0.35;
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(78,54,30,0.09)'; c.lineWidth = 1.5;
  c.beginPath();
  for (let i = 0; i < 6; i++) {
    if (F.ghosts) break;
    if (F.groom > 0.35 && i < 2) continue;
    const G = legPts(i, F.legs[i]), lf = G.lift * 1.4;
    const o = (p, hgt) => [p[0] + sx * (hgt + lf) * 0.9, p[1] + sy * (hgt + lf) * 0.9];
    const pts = [o(G.c1, 1.0), o(G.knee, 0.95), o(G.ankle, 0.3), o(G.claw, 0)];
    c.moveTo(pts[0][0], pts[0][1]);
    for (let q = 1; q < 4; q++) c.lineTo(pts[q][0], pts[q][1]);
  }
  c.stroke();
  c.translate(-15 + sx * k, sy * k);
  c.scale(1, 0.37);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 64);
  g.addColorStop(0, 'rgba(66,44,22,0.34)'); g.addColorStop(0.5, 'rgba(66,44,22,0.2)'); g.addColorStop(1, 'rgba(66,44,22,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 64, 0, TAU); c.fill();
  c.restore();
}

function drawLegs(c, F, idx) {
  const px = F.px, lw = Math.max(0.42, 0.6 * px);
  for (const k of idx) {
    const G = legPts(k, F.legs[k]);
    const { c0, c1, knee, ankle, claw } = G;
    // coxa, femur, tibia
    c.beginPath();
    segPath(c, c0, c1, 4.6, 5.0, 3.8);
    segPath(c, c1, knee, 3.3, 4.1, 2.7);
    segPath(c, knee, ankle, 2.5, 2.2, 1.7);
    c.fillStyle = COL.leg; c.fill();
    c.lineWidth = lw; c.strokeStyle = 'rgba(52,32,14,0.9)'; c.stroke();
    // lit edge on femur and tibia
    c.strokeStyle = COL.legHi; c.lineWidth = Math.max(0.45, 0.5 * px); c.lineCap = 'round';
    c.beginPath();
    for (const [a, b, w] of [[c1, knee, 3.4], [knee, ankle, 2.0]]) {
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
      const sgn = (nx * F.light[0] + ny * F.light[1]) > 0 ? 1 : -1, o = w * 0.22 * sgn;
      c.moveTo(a[0] + dx * 0.15 + nx * o, a[1] + dy * 0.15 + ny * o);
      c.lineTo(a[0] + dx * 0.85 + nx * o, a[1] + dy * 0.85 + ny * o);
    }
    c.stroke();
    // dark knee and ankle joints
    c.fillStyle = COL.legD;
    c.beginPath(); c.arc(knee[0], knee[1], 1.35, 0, TAU); c.arc(ankle[0], ankle[1], 0.95, 0, TAU); c.fill();
    // tarsus: five tarsomeres
    const tx = claw[0] - ankle[0], ty = claw[1] - ankle[1], tl = Math.hypot(tx, ty) || 1, ux = tx / tl, uy = ty / tl;
    const fr = [0, 0.36, 0.56, 0.72, 0.85, 1];
    c.beginPath();
    for (let q = 0; q < 5; q++) {
      const a = [ankle[0] + tx * fr[q] + ux * 0.25, ankle[1] + ty * fr[q] + uy * 0.25];
      const b = [ankle[0] + tx * fr[q + 1] - ux * 0.2, ankle[1] + ty * fr[q + 1] - uy * 0.2];
      const w = 1.35 - q * 0.1;
      segPath(c, a, b, w * 0.85, w, w * 0.9);
    }
    c.fillStyle = '#b4834f'; c.fill();
    c.lineWidth = lw * 0.9; c.strokeStyle = 'rgba(52,32,14,0.85)'; c.stroke();
    // claws
    const nx = -uy, ny = ux;
    c.beginPath();
    for (const s of [-1, 1]) {
      c.moveTo(claw[0], claw[1]);
      c.quadraticCurveTo(claw[0] + ux * 1.0 + nx * s * 0.5, claw[1] + uy * 1.0 + ny * s * 0.5, claw[0] + ux * 0.6 + nx * s * 1.3, claw[1] + uy * 0.6 + ny * s * 1.3);
    }
    c.lineWidth = Math.max(0.28, 0.5 * px); c.strokeStyle = INK; c.stroke();
    // bristles along femur, tibia, tarsus
    c.beginPath();
    const hr = rng(300 + k);
    const hairs = (a, b, w, n, len) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, ex = dx / l, ey = dy / l, hx = -ey, hy = ex;
      for (let q = 0; q < n; q++) {
        const s = q % 2 ? 1 : -1, ff = 0.08 + 0.86 * (q + hr() * 0.8) / n;
        const bx = a[0] + dx * ff + hx * s * w * 0.42, by = a[1] + dy * ff + hy * s * w * 0.42;
        const ll = len * (0.6 + hr() * 0.6), sp = 0.28 + hr() * 0.22;
        c.moveTo(bx, by);
        c.lineTo(bx + (ex + hx * s * sp) * ll, by + (ey + hy * s * sp) * ll);
      }
    };
    hairs(c1, knee, 3.6, 7, 1.3);
    hairs(knee, ankle, 2.2, 12, 1.25);
    hairs(ankle, claw, 1.2, 7, 0.75);
    c.lineWidth = Math.max(0.14, 0.3 * px); c.strokeStyle = 'rgba(40,24,10,0.55)'; c.stroke();
    // tibial spurs
    const sx = ankle[0] - knee[0], sy = ankle[1] - knee[1], sl = Math.hypot(sx, sy) || 1;
    c.beginPath();
    c.moveTo(ankle[0] - sx / sl * 0.6, ankle[1] - sy / sl * 0.6);
    c.lineTo(ankle[0] + sx / sl * 1.8 - sy / sl * 1.0, ankle[1] + sy / sl * 1.8 + sx / sl * 1.0);
    c.lineWidth = Math.max(0.35, 0.55 * px); c.strokeStyle = INK; c.stroke();
  }
}

function drawAbdomen(c, F) {
  const [lx, ly] = F.light, px = F.px;
  c.beginPath(); closedSpline(c, ABD);
  const g = c.createRadialGradient(-36 + lx * 10, ly * 10, 2, -38, 0, 26);
  g.addColorStop(0, COL.abd0); g.addColorStop(0.55, COL.abd1); g.addColorStop(1, COL.abd2);
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  // tergites: dark posterior bands, curved, narrowing at the sides
  const xs = [-12.5, -19.5, -27.8, -36.8, -45.8, -54.2, -61.6, -69];
  for (let i = 1; i < 7; i++) {
    const segL = xs[i] - xs[i + 1], th = segL * (i === 6 ? 0.85 : i === 1 ? 0.32 : 0.5);
    c.beginPath();
    const pts = [];
    for (let y = -23; y <= 23; y += 1.5) {
      const q = clamp(Math.abs(y) / 21, 0, 1);
      const xb = xs[i + 1] - 2.3 * (1 - q * q);
      pts.push([xb + th * (1 - 0.55 * q * q), y]);
    }
    for (let y = 23; y >= -23; y -= 1.5) { const q = clamp(Math.abs(y) / 21, 0, 1); pts.push([xs[i + 1] - 2.3 * (1 - q * q) - 0.2, y]); }
    c.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) c.lineTo(p[0], p[1]);
    c.closePath();
    c.fillStyle = i >= 5 ? 'rgba(42,26,14,0.93)' : 'rgba(52,32,16,0.86)'; c.fill();
  }
  // intersegment seams
  c.strokeStyle = 'rgba(255,236,200,0.25)'; c.lineWidth = Math.max(0.35, 0.6 * px);
  c.beginPath();
  for (let i = 1; i < 7; i++) {
    for (let y = -22; y <= 22; y += 2) { const q = Math.abs(y) / 21; const x = xs[i] - 2.3 * (1 - q * q); y === -22 ? c.moveTo(x, y) : c.lineTo(x, y); }
  }
  c.stroke();
  // fine hairs, rows near each tergite margin
  c.beginPath();
  for (let i = 1; i < 7; i++) {
    for (let y = -17; y <= 17; y += 2.6) {
      const q = Math.abs(y) / 21, x = xs[i + 1] - 2.3 * (1 - q * q) + 1.2;
      c.moveTo(x, y); c.lineTo(x - 2.0, y + y * 0.04);
    }
  }
  c.strokeStyle = 'rgba(40,22,8,0.55)'; c.lineWidth = Math.max(0.2, 0.35 * px); c.stroke();
  // roundness: rim shade + soft highlight
  let rg = c.createRadialGradient(-38, 0, 8, -38, 0, 34);
  rg.addColorStop(0, 'rgba(60,34,12,0)'); rg.addColorStop(0.7, 'rgba(60,34,12,0.08)'); rg.addColorStop(1, 'rgba(60,34,12,0.42)');
  c.fillStyle = rg; c.fillRect(-75, -25, 70, 50);
  rg = c.createRadialGradient(-33 + lx * 9, ly * 9, 0, -33 + lx * 9, ly * 9, 12);
  rg.addColorStop(0, 'rgba(255,248,230,0.4)'); rg.addColorStop(1, 'rgba(255,248,230,0)');
  c.fillStyle = rg; c.fillRect(-75, -25, 70, 50);
  c.restore();
  c.beginPath(); closedSpline(c, ABD);
  c.lineWidth = Math.max(0.55, 0.75 * px); c.strokeStyle = INK; c.stroke();
}

function drawHalteres(c, F) {
  const px = F.px;
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(-11.5, s * 12.5); c.lineTo(-15.2, s * 16.6);
    c.lineWidth = 0.9; c.strokeStyle = '#a7804f'; c.stroke();
    c.beginPath(); c.ellipse(-16.2, s * 17.6, 2.2, 1.8, s * 0.7, 0, TAU);
    c.fillStyle = '#efe0b9'; c.fill();
    c.lineWidth = Math.max(0.35, 0.6 * px); c.strokeStyle = 'rgba(52,32,14,0.85)'; c.stroke();
  }
}

function drawOneWing(c, F, side, ang, alpha, detail) {
  const px = F.px;
  c.save();
  c.translate(4.5, side * 11.6);
  c.rotate(Math.PI - side * ang);
  if (side > 0) c.scale(1, -1);
  c.beginPath(); closedSpline(c, WOUT);
  c.fillStyle = `rgba(248,249,244,${0.2 * alpha})`; c.fill();
  const g = c.createLinearGradient(0, -12, WL, 14);
  g.addColorStop(0, 'rgba(255,200,200,0)');
  g.addColorStop(0.32, `rgba(255,196,168,${0.13 * alpha})`);
  g.addColorStop(0.52, `rgba(166,232,196,${0.13 * alpha})`);
  g.addColorStop(0.74, `rgba(170,186,255,${0.13 * alpha})`);
  g.addColorStop(1, 'rgba(210,170,255,0)');
  c.fillStyle = g; c.fill();
  // smoky veil near base
  const g2 = c.createLinearGradient(0, 0, WL * 0.5, 0);
  g2.addColorStop(0, `rgba(120,96,70,${0.12 * alpha})`); g2.addColorStop(1, 'rgba(120,96,70,0)');
  c.fillStyle = g2; c.fill();
  c.lineWidth = Math.max(0.3, 0.55 * px); c.strokeStyle = `rgba(70,52,34,${0.55 * alpha})`; c.stroke();
  // sheen streak, depends on where the light is
  const sh = 0.5 + 0.5 * (F.light[0] * -Math.cos(ang) + F.light[1] * side * Math.sin(ang));
  c.save(); c.clip();
  const g3 = c.createLinearGradient(WL * 0.2, 10, WL * 0.6, -8);
  g3.addColorStop(0, 'rgba(255,255,255,0)'); g3.addColorStop(0.5, `rgba(255,255,255,${(0.1 + 0.25 * sh) * alpha})`); g3.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g3; c.fillRect(0, -25, WL, 40);
  c.restore();
  // veins
  const vein = (pts, w0, w1, a) => {
    // thick proximal half, then the whole vein at the distal width
    c.strokeStyle = `rgba(78,52,28,${a * alpha})`;
    c.beginPath(); openSpline(c, pts); c.lineWidth = Math.max(w1, 0.5 * px); c.stroke();
    if (pts.length > 2 && w0 > w1 + 0.08) {
      c.beginPath(); openSpline(c, pts.slice(0, Math.ceil(pts.length / 2))); c.lineWidth = Math.max(w0, 0.5 * px); c.stroke();
    }
  };
  if (detail) {
    c.lineCap = 'round';
    vein(VEINS.C, 0.75, 0.4, 0.9);
    vein(VEINS.Sc, 0.4, 0.3, 0.45);
    vein(VEINS.L1, 0.55, 0.45, 0.85);
    vein(VEINS.L2, 0.55, 0.32, 0.85);
    vein(VEINS.L3, 0.55, 0.32, 0.85);
    vein(VEINS.L4, 0.55, 0.32, 0.85);
    vein(VEINS.L5, 0.5, 0.3, 0.8);
    vein(VEINS.L6, 0.45, 0.3, 0.45);
    vein(VEINS.acv, 0.42, 0.42, 0.85);
    vein(VEINS.pcv, 0.42, 0.42, 0.85);
    vein(VEINS.hcv, 0.4, 0.4, 0.6);
    vein(VEINS.bcv, 0.35, 0.35, 0.5);
    // marginal fringe of microtrichia on the trailing edge
    if (px < 0.9) {
      c.beginPath();
      for (let i = 11; i < WOUT.length - 1; i++) {
        const a = WOUT[i], b = WOUT[i + 1];
        for (let q = 0; q < 4; q++) {
          const f = q / 4, x = lerp(a[0], b[0], f), y = lerp(a[1], b[1], f);
          const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
          c.moveTo(x, y); c.lineTo(x + dy / l * 1.4 - dx / l * 0.7, y - dx / l * 1.4 - dy / l * 0.7);
        }
      }
      c.lineWidth = 0.14; c.strokeStyle = `rgba(80,60,40,${0.16 * alpha})`; c.stroke();
    }
  } else {
    c.lineCap = 'round';
    for (const k of ['C', 'L2', 'L3', 'L4', 'L5']) {
      c.beginPath(); openSpline(c, VEINS[k]);
      c.lineWidth = 0.45; c.strokeStyle = `rgba(78,52,28,${0.7 * alpha})`; c.stroke();
    }
  }
  c.restore();
}

function drawWings(c, F) {
  const rest = -0.015;
  if (F.buzz > 0.02) {
    // motion-blurred stroke: a fan of faint wing copies over the stroke arc
    const K = 9;
    for (const side of [-1, 1]) {
      for (let q = 0; q < K; q++) {
        const a = rest + 0.35 + (1.15 * F.buzz) * (q / (K - 1));
        drawOneWing(c, F, side, a, 0.17 + 0.05 * (1 - F.buzz), false);
      }
    }
    return;
  }
  const a = rest + 0.55 * sstep(F.spread);
  drawOneWing(c, F, -1, a, 1, true);
  drawOneWing(c, F, 1, a, 1, true);
}

function bristle(c, x, y, ang, len, w) {
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx, b = len * 0.07;
  const tx = x + dx * len + nx * b, ty = y + dy * len + ny * b;
  c.moveTo(x + nx * w / 2, y + ny * w / 2);
  c.quadraticCurveTo(x + dx * len * 0.55 + nx * (w * 0.3 + b * 0.8), y + dy * len * 0.55 + ny * (w * 0.3 + b * 0.8), tx, ty);
  c.quadraticCurveTo(x + dx * len * 0.55 + nx * (b * 0.8 - w * 0.3), y + dy * len * 0.55 + ny * (b * 0.8 - w * 0.3), x - nx * w / 2, y - ny * w / 2);
  c.closePath();
}
const THX_BR = [ // left side: x, y, angle(deg, 180 = straight back), length
  [19.6, -12.4, 200, 7.5], [17.4, -13.9, 212, 6], [12.6, -15.4, 196, 8.5], [6.5, -16.1, 191, 8.5],
  [-1, -15.5, 188, 10], [-10.4, -13.4, 197, 10], [1.5, -6.3, 183, 9.5], [-8.6, -6.5, 184, 12.5],
];
const SCU_BR = [[-17.2, -8.4, 206, 10], [-23.6, -3.9, 167, 16.5]];
const HEAD_BR = [
  [25.6, -1.1, -32, 7.4], [21.9, -2.3, 160, 6], [22.6, -5.6, 176, 9], [22.1, -8.7, -160, 9.2],
  [34.6, -5.0, -12, 6], [31.6, -5.4, 190, 6.6], [29.0, -5.7, 192, 7.2],
];

function drawThorax(c, F) {
  const [lx, ly] = F.light, px = F.px;
  c.beginPath(); closedSpline(c, THX);
  let g = c.createRadialGradient(5 + lx * 9, ly * 9, 1, 4, 0, 22);
  g.addColorStop(0, COL.thx0); g.addColorStop(0.55, COL.thx1); g.addColorStop(1, COL.thx2);
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  // vittae: faint darker stripes
  c.lineCap = 'round';
  c.strokeStyle = 'rgba(110,64,28,0.15)';
  for (const y of [-6.4, 6.4]) { c.lineWidth = 3.6; c.beginPath(); c.moveTo(23, y * 0.75); c.quadraticCurveTo(5, y * 1.06, -13, y * 0.82); c.stroke(); }
  c.lineWidth = 1.8; c.beginPath(); c.moveTo(24, 0); c.lineTo(-13, 0); c.stroke();
  // microchaetae rows
  c.beginPath();
  const mr = rng(77);
  for (const y0 of [1.5, 3.9, 6.4, 8.9, 11.3, 13.5]) {
    for (const s of [-1, 1]) {
      for (let x = 22 - y0 * 0.45 - mr() * 1.5; x > -13; x -= 1.7 + mr() * 1.2) {
        const y = s * (y0 + (mr() - 0.5) * 1.1);
        const l = 0.9 + mr() * 0.6;
        c.moveTo(x, y); c.lineTo(x - l, y + s * (0.15 + mr() * 0.25));
      }
    }
  }
  c.strokeStyle = 'rgba(48,26,8,0.42)'; c.lineWidth = Math.max(0.16, 0.3 * px); c.stroke();
  // humeral calli
  for (const s of [-1, 1]) {
    const hg = c.createRadialGradient(20, s * 11.5, 0, 20, s * 11.5, 5);
    hg.addColorStop(0, 'rgba(250,215,160,0.5)'); hg.addColorStop(1, 'rgba(250,215,160,0)');
    c.fillStyle = hg; c.fillRect(14, s * 11.5 - 6, 12, 12);
  }
  // rim shade and gloss
  g = c.createRadialGradient(4, 0, 6, 4, 0, 22);
  g.addColorStop(0, 'rgba(60,32,10,0)'); g.addColorStop(0.75, 'rgba(60,32,10,0.1)'); g.addColorStop(1, 'rgba(60,32,10,0.45)');
  c.fillStyle = g; c.fillRect(-20, -20, 50, 40);
  g = c.createRadialGradient(8 + lx * 8, ly * 8, 0, 8 + lx * 8, ly * 8, 9);
  g.addColorStop(0, 'rgba(255,250,235,0.55)'); g.addColorStop(1, 'rgba(255,250,235,0)');
  c.fillStyle = g; c.fillRect(-20, -20, 50, 40);
  c.restore();
  c.beginPath(); closedSpline(c, THX);
  c.lineWidth = Math.max(0.55, 0.75 * px); c.strokeStyle = INK; c.stroke();
  // suture line (transverse)
  c.beginPath(); c.moveTo(-1, -16.5); c.quadraticCurveTo(2, -12, 6.5, -9.5);
  c.moveTo(-1, 16.5); c.quadraticCurveTo(2, 12, 6.5, 9.5);
  c.lineWidth = Math.max(0.3, 0.45 * px); c.strokeStyle = 'rgba(60,34,12,0.45)'; c.stroke();
  // scutellum
  c.beginPath(); closedSpline(c, SCU);
  g = c.createRadialGradient(-18 + lx * 4, ly * 4, 0.5, -19, 0, 10);
  g.addColorStop(0, '#dcad6e'); g.addColorStop(0.6, '#b07a42'); g.addColorStop(1, '#7c5028');
  c.fillStyle = g; c.fill();
  c.lineWidth = Math.max(0.5, 0.7 * px); c.strokeStyle = INK; c.stroke();
  // macrochaetae with sockets
  c.beginPath();
  const all = [];
  for (const b of THX_BR.concat(SCU_BR)) { all.push(b); all.push([b[0], -b[1], -b[2], b[3]]); }
  for (const [x, y, a, l] of all) bristle(c, x, y, deg(a), l, Math.max(0.62, 1.0 * px));
  c.fillStyle = INK; c.fill();
  c.beginPath();
  for (const [x, y] of all) { c.moveTo(x + 0.55, y); c.arc(x, y, 0.55, 0, TAU); }
  c.fillStyle = 'rgba(70,40,16,0.55)'; c.fill();
}

function drawProboscis(c, F) {
  const e = F.feed, px = F.px;
  const tip = 38 + 8 * e;
  c.beginPath(); segPath(c, [35, 0], [tip, 0], 3.4, 3.2, 2.8);
  c.fillStyle = '#b98552'; c.fill(); c.lineWidth = Math.max(0.4, 0.6 * px); c.strokeStyle = INK; c.stroke();
  for (const s of [-1, 1]) {
    c.beginPath(); c.ellipse(tip + 2.2, s * 1.7, 2.8 * (0.85 + 0.15 * e), 2.0, s * 0.35, 0, TAU);
    c.fillStyle = '#d8ae80'; c.fill(); c.stroke();
    c.beginPath();
    for (let q = -2; q <= 2; q++) { c.moveTo(tip + 0.8, s * 1.7 + q * 0.2); c.quadraticCurveTo(tip + 2.4, s * (1.7 + q * 0.55), tip + 4.4, s * (1.7 + q * 0.8)); }
    c.lineWidth = Math.max(0.15, 0.3 * px); c.strokeStyle = 'rgba(90,50,20,0.6)'; c.stroke();
  }
}

function drawEye(c, F, s) {
  const px = F.px;
  c.save();
  c.translate(EYE.cx, s * EYE.cy); c.rotate(-s * EYE.rot);
  const l = rotV(F.light, s * EYE.rot);
  c.beginPath(); c.ellipse(0, 0, EYE.rx, EYE.ry, 0, 0, TAU);
  let g = c.createRadialGradient(l[0] * 3.2, l[1] * 3.2, 0.5, 0, 0, 9.5);
  g.addColorStop(0, '#f2654c'); g.addColorStop(0.42, '#c92d1f'); g.addColorStop(0.8, '#8a170f'); g.addColorStop(1, '#4a0805');
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  // facet lattice
  c.lineWidth = Math.max(0.12, 0.32 * px);
  c.strokeStyle = `rgba(55,4,2,${px < 0.6 ? 0.42 : 0.2})`;
  c.stroke(FACETS.p);
  if (px < 0.7) {
    c.beginPath();
    for (const [x, y] of FACETS.glints) { const gx = x + l[0] * 0.18, gy = y + l[1] * 0.18; c.moveTo(gx + 0.17, gy); c.arc(gx, gy, 0.17, 0, TAU); }
    c.fillStyle = 'rgba(255,215,190,0.28)'; c.fill();
  }
  // pseudopupil
  g = c.createRadialGradient(-0.4, 0, 0, -0.4, 0, 2.8);
  g.addColorStop(0, 'rgba(30,0,0,0.55)'); g.addColorStop(1, 'rgba(30,0,0,0)');
  c.fillStyle = g; c.fillRect(-4, -4, 8, 8);
  // limb darkening
  g = c.createRadialGradient(0, 0, 4, 0, 0, 9.2);
  g.addColorStop(0, 'rgba(40,0,0,0)'); g.addColorStop(1, 'rgba(40,0,0,0.5)');
  c.fillStyle = g; c.fillRect(-10, -10, 20, 20);
  // specular
  const hx = l[0] * 4.3, hy = l[1] * 3.5;
  g = c.createRadialGradient(hx, hy, 0, hx, hy, 3.2);
  g.addColorStop(0, 'rgba(255,250,240,0.75)'); g.addColorStop(0.4, 'rgba(255,240,230,0.25)'); g.addColorStop(1, 'rgba(255,240,230,0)');
  c.fillStyle = g; c.fillRect(hx - 4, hy - 4, 8, 8);
  c.beginPath(); c.ellipse(hx * 1.05, hy * 1.05, 1.1, 0.7, Math.atan2(l[1], l[0]) + Math.PI / 2, 0, TAU);
  c.fillStyle = 'rgba(255,255,255,0.85)'; c.fill();
  c.restore();
  c.beginPath(); c.ellipse(0, 0, EYE.rx, EYE.ry, 0, 0, TAU);
  c.lineWidth = Math.max(0.5, 0.7 * px); c.strokeStyle = '#2a0a05'; c.stroke();
  c.restore();
}

function drawAntenna(c, F, s) {
  const px = F.px;
  c.save();
  c.translate(38.4, s * 3.3);
  c.rotate(s * (0.5 + F.ant));
  // pedicel
  c.beginPath(); c.arc(0, 0, 1.9, 0, TAU);
  c.fillStyle = '#b06e35'; c.fill(); c.lineWidth = Math.max(0.35, 0.55 * px); c.strokeStyle = INK; c.stroke();
  // funiculus (third segment)
  c.beginPath(); c.ellipse(3.4, 0, 3.4, 2.2, 0, 0, TAU);
  const g = c.createRadialGradient(2.6, -0.6 * s, 0.2, 3.4, 0, 3.6);
  g.addColorStop(0, '#e2a868'); g.addColorStop(1, '#a4652d');
  c.fillStyle = g; c.fill(); c.stroke();
  // arista: plumose, branches mostly on the dorsal (outer) side
  c.beginPath();
  const ax0 = 2.4, ay0 = s * 1.2;
  const P = u => [ax0 + u * 13, ay0 + s * (u * 2.6 + u * u * 1.4)];
  let p = P(0); c.moveTo(p[0], p[1]);
  for (let u = 0.1; u <= 1.001; u += 0.1) { p = P(u); c.lineTo(p[0], p[1]); }
  c.lineWidth = Math.max(0.3, 0.5 * px); c.strokeStyle = '#3a2412'; c.stroke();
  c.beginPath();
  const br = [[0.28, 1, 3.4], [0.4, 1, 3.6], [0.52, 1, 3.5], [0.64, 1, 3.1], [0.76, 1, 2.6], [0.88, 1, 2.0], [0.36, -1, 2.4], [0.56, -1, 2.3], [0.74, -1, 1.8]];
  for (const [u, side, len] of br) {
    const a = P(u), b = P(u + 0.05), dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    const ex = dx / l, ey = dy / l, nx = -ey * s * side, ny = ex * s * side;
    c.moveTo(a[0], a[1]); c.lineTo(a[0] + (ex * 0.8 + nx * 0.6) * len, a[1] + (ey * 0.8 + ny * 0.6) * len);
  }
  c.lineWidth = Math.max(0.18, 0.4 * px); c.stroke();
  c.restore();
}

function drawHead(c, F) {
  const [lx, ly] = F.light, px = F.px;
  c.save();
  c.translate(22, 0); c.rotate(F.headYaw); c.translate(-22, 0);
  c.beginPath(); closedSpline(c, HEAD);
  let g = c.createRadialGradient(30 + lx * 5, ly * 5, 1, 30, 0, 18);
  g.addColorStop(0, '#e2a35e'); g.addColorStop(0.6, '#c27f3f'); g.addColorStop(1, '#8c5426');
  c.fillStyle = g; c.fill();
  c.lineWidth = Math.max(0.55, 0.75 * px); c.strokeStyle = INK; c.stroke();
  // frontal vitta: the reddish band down the middle of the frons
  c.beginPath(); c.moveTo(38.6, -3.6); c.quadraticCurveTo(31, -5.4, 24.5, -3.6); c.lineTo(24.5, 3.6); c.quadraticCurveTo(31, 5.4, 38.6, 3.6); c.closePath();
  c.fillStyle = 'rgba(176,74,30,0.45)'; c.fill();
  for (const s of [-1, 1]) drawEye(c, F, s);
  // ocellar triangle and ocelli
  c.beginPath(); c.moveTo(27.6, 0); c.lineTo(23.2, -2.6); c.lineTo(23.2, 2.6); c.closePath();
  c.fillStyle = 'rgba(70,40,18,0.85)'; c.fill();
  for (const [x, y] of [[26.4, 0], [23.9, -1.45], [23.9, 1.45]]) {
    c.beginPath(); c.arc(x, y, 0.75, 0, TAU); c.fillStyle = '#e8b871'; c.fill();
    c.beginPath(); c.arc(x - 0.2, y - 0.2, 0.28, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.9)'; c.fill();
  }
  // head bristles
  c.beginPath();
  for (const [x, y, a, l] of HEAD_BR) { bristle(c, x, y, deg(a), l, Math.max(0.5, 1.0 * px)); bristle(c, x, -y, -deg(a), l, Math.max(0.5, 1.0 * px)); }
  c.fillStyle = INK; c.fill();
  for (const s of [-1, 1]) drawAntenna(c, F, s);
  c.restore();
}

function drawFly(c, F) {
  const front = F.groom > 0.35;
  if (F.shadow) flyShadow(c, F);
  if (F.ghosts) {
    const a0 = c.globalAlpha, ga = Math.min(1, 1.9 / F.ghosts.length);
    for (const g of F.ghosts) { c.globalAlpha = a0 * ga; drawLegs(c, { ...F, legs: g }, front ? [4, 5, 2, 3] : [4, 5, 2, 3, 0, 1]); }
    c.globalAlpha = a0;
  } else drawLegs(c, F, front ? [4, 5, 2, 3] : [4, 5, 2, 3, 0, 1]);
  drawAbdomen(c, F);
  drawHalteres(c, F);
  drawWings(c, F);
  drawThorax(c, F);
  if (F.feed > 0.01) drawProboscis(c, F);
  drawHead(c, F);
  if (front) drawLegs(c, F, [0, 1]);
}

// ============================================================ apple slice (static, into the paper layer)
const APPLE_OUT = [[0, -100], [3, -70], [-5, -40], [-15, -14], [-16.5, 8], [-8, 38], [1.5, 70], [0, 101],
  [-14, 105], [-38, 100], [-64, 83], [-84, 53], [-95, 16], [-94, -20], [-85, -54], [-65, -82], [-41, -98], [-23, -103], [-13, -97]];
const APPLE_SKIN = [[0, 101], [-14, 105], [-38, 100], [-64, 83], [-84, 53], [-95, 16], [-94, -20], [-85, -54], [-65, -82], [-41, -98], [-23, -103], [-13, -97], [0, -100]];
function drawApple(c) {
  const r = rng(11);
  c.save();
  c.translate(APPLE.x, APPLE.y); c.rotate(APPLE.rot); c.scale(APPLE.s, APPLE.s);
  // soft cast shadow
  for (let i = 0; i < 4; i++) {

  c.lineWidth = 0.9; c.strokeStyle = 'rgba(150,120,60,0.55)'; c.stroke();

  c.fillStyle = 'rgba(222,196,130,0.6)'; c.fill();
  c.lineWidth = 0.9; c.strokeStyle = 'rgba(120,88,40,0.7)'; c.stroke();

// ============================================================ spider (live, mostly still)
const SPL = [ // attach, base angle (deg from forward, outward), segment lengths, bends, widths
  { a: [34, 17], ang: 38, len: [5, 30, 11, 24, 18, 11], bend: [0, 12, -30, -8, -6, -4], w: [7.4, 7, 6.4, 5.2, 3.6, 2.4] },
  { a: [24, 21], ang: 72, len: [5, 26, 10, 20, 16, 10], bend: [0, 8, -24, -6, -4, -3], w: [5.6, 5.2, 4.8, 4, 2.9, 2] },
  { a: [11, 22], ang: 108, len: [5, 25, 10, 20, 18, 10], bend: [0, -6, 22, 8, 6, 4], w: [5.6, 5.2, 4.8, 4, 2.9, 2] },
  { a: [-1, 19], ang: 146, len: [5, 30, 11, 24, 22, 11], bend: [0, -8, 22, 10, 6, 4], w: [5.8, 5.4, 5, 4.2, 3, 2] },
];
const SP_CARA = mirror([[46, 0], [44.5, -12], [39, -20.5], [27, -24], [11, -23.5], [0, -19.5], [-6, -10.5], [-7.5, 0]]);
const SP_ABD = mirror([[-6, 0], [-9, -13], [-19, -23.5], [-35, -28], [-52, -26.5], [-66, -19], [-75, -9], [-77, 0]]);

function drawSpider(c, t) {
  const r = rng(5);
  const alert = 0;
  c.save();
  c.translate(SPIDER.x, SPIDER.y); c.rotate(SPIDER.h); c.scale(SPIDER.s, SPIDER.s);
  // shadow
  c.save(); c.translate(-12 + 5, 6); c.scale(1, 0.55);
  const sg = c.createRadialGradient(0, 0, 0, 0, 0, 66);
  sg.addColorStop(0, 'rgba(66,44,22,0.3)'); sg.addColorStop(1, 'rgba(66,44,22,0)');
  c.fillStyle = sg; c.beginPath(); c.arc(0, 0, 66, 0, TAU); c.fill();
  c.restore();
  // legs
  for (const s of [-1, 1]) {
    SPL.forEach((L, li) => {
      let ang = deg(L.ang);
      const pts = [[L.a[0], s * L.a[1]]];
      let x = L.a[0], y = s * L.a[1];
      const tw = 0.03 * Math.sin(TAU * (0.35 + li * 0.13) * t + li + (s > 0 ? 1 : 0));
      for (let q = 0; q < L.len.length; q++) {
        ang += deg(L.bend[q]) + tw * (q > 1 ? 1 : 0);
        let len = L.len[q];
        if (li === 0) { // front legs lift and reach a little when the fly is near
          if (q === 1) { ang -= deg(8) * alert; len *= 1 - 0.14 * alert; }
          if (q >= 3) ang -= deg(4) * alert * Math.sin(TAU * 1.3 * t) * 0.5;
        }
        x += Math.cos(ang) * len; y += s * Math.sin(ang) * len;
        pts.push([x, y]);
      }
      // leg shadow
      c.beginPath(); c.moveTo(pts[0][0] + 4, pts[0][1] + 5);
      for (let q = 1; q < pts.length; q++) { const hgt = q < 3 ? 1 : q < 5 ? 0.6 : 0.15; c.lineTo(pts[q][0] + 5 * hgt, pts[q][1] + 6 * hgt); }
      c.lineWidth = 3; c.strokeStyle = 'rgba(66,44,22,0.12)'; c.lineCap = 'round'; c.stroke();
      // segments
      c.beginPath();
      for (let q = 0; q < pts.length - 1; q++) {
        const w0 = L.w[q], w1 = L.w[Math.min(q + 1, L.w.length - 1)];
        segPath(c, pts[q], pts[q + 1], w0, (w0 + w1) / 2 + 0.6, w1);
      }
      c.fillStyle = li === 0 ? '#3a2d24' : '#4a3a2e'; c.fill();
      c.lineWidth = 0.7; c.strokeStyle = '#120c07'; c.stroke();
      // pale rings at joints (banding)
      c.beginPath();
      for (let q = 2; q < pts.length - 1; q++) {
        const a = pts[q], b = pts[q + 1], f = 0.18;
        segPath(c, a, [lerp(a[0], b[0], f), lerp(a[1], b[1], f)], L.w[q] * 0.95, L.w[q] * 0.95, L.w[q] * 0.9);
      }
      c.fillStyle = 'rgba(214,190,150,0.75)'; c.fill();
      // hairs and spines
      c.beginPath();
      for (let q = 1; q < pts.length - 1; q++) {
        const a = pts[q], b = pts[q + 1], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), ex = dx / l, ey = dy / l;
        const n = Math.round(l / 2.2);
        for (let h = 0; h < n; h++) {
          const f = (h + r()) / n, side = h % 2 ? 1 : -1, w = L.w[q] / 2;
          const bx = a[0] + dx * f - ey * side * w, by = a[1] + dy * f + ex * side * w, hl = 2 + r() * 2.4;
          c.moveTo(bx, by); c.lineTo(bx + (ex * 0.7 - ey * side * 0.7) * hl, by + (ey * 0.7 + ex * side * 0.7) * hl);
        }
      }
      c.lineWidth = 0.45; c.strokeStyle = 'rgba(24,16,10,0.75)'; c.stroke();
    });
  }
  // pedipalps (fuzzy, pale tipped)
  for (const s of [-1, 1]) {
    const a = [43, s * 9], b = [52, s * 13.5], d = [59 + 1.2 * Math.sin(TAU * 1.7 * t + s), s * 11];
    c.beginPath(); segPath(c, a, b, 3.6, 3.8, 3.4); segPath(c, b, d, 3.4, 4.4, 4.2);
    c.fillStyle = '#3e3026'; c.fill(); c.lineWidth = 0.6; c.strokeStyle = '#120c07'; c.stroke();
    c.beginPath(); c.arc(d[0], d[1], 3.0, 0, TAU); c.fillStyle = 'rgba(244,236,214,0.95)'; c.fill(); c.lineWidth = 0.5; c.stroke();
  }
  // abdomen
  for (let i = 0; i < 3; i++) { c.beginPath(); closedSpline(c, jitter(SP_ABD, r, 1.4)); c.fillStyle = 'rgba(58,44,34,0.45)'; c.fill(); }
  c.save(); c.beginPath(); closedSpline(c, SP_ABD); c.clip();
  // dorsal pattern: pale chevrons and white spots
  c.fillStyle = 'rgba(196,150,92,0.55)';
  for (const [x, w] of [[-22, 9], [-36, 11], [-50, 10], [-62, 8]]) {
    c.beginPath(); c.moveTo(x + 4, 0); c.lineTo(x - 3, -w); c.lineTo(x - 7, -w + 2); c.lineTo(x - 2, 0); c.lineTo(x - 7, w - 2); c.lineTo(x - 3, w); c.closePath(); c.fill();
  }
  c.fillStyle = 'rgba(250,246,232,0.95)';
  for (const [x, y, rr] of [[-15, 0, 4.6], [-30, -13, 3.8], [-30, 13, 3.8], [-47, -14, 3.4], [-47, 14, 3.4], [-64, -6, 2.4], [-64, 6, 2.4]]) {
    c.beginPath(); c.ellipse(x, y, rr * 1.2, rr, 0, 0, TAU); c.fill();
    c.lineWidth = 0.6; c.strokeStyle = 'rgba(20,12,6,0.6)'; c.stroke();
  }
  const ag = c.createRadialGradient(-38 - 8, -8, 4, -40, 0, 40);
  ag.addColorStop(0, 'rgba(255,240,210,0.16)'); ag.addColorStop(0.6, 'rgba(20,12,6,0)'); ag.addColorStop(1, 'rgba(20,12,6,0.4)');
  c.fillStyle = ag; c.fillRect(-80, -30, 76, 60);
  c.restore();
  // abdomen hair fringe
  c.beginPath();
  for (let i = 0; i < 150; i++) {
    const a = r() * TAU, ex = Math.cos(a), ey = Math.sin(a);
    const x = -41 + ex * 35.5, y = ey * 27.4, hl = 1.8 + r() * 2.2;
    c.moveTo(x, y); c.lineTo(x + ex * hl - ey * 0.6, y + ey * hl + ex * 0.6);
  }
  c.lineWidth = 0.5; c.strokeStyle = 'rgba(20,12,6,0.8)'; c.stroke();
  c.beginPath(); closedSpline(c, SP_ABD); c.lineWidth = 0.9; c.strokeStyle = '#120c07'; c.stroke();
  // carapace
  for (let i = 0; i < 3; i++) { c.beginPath(); closedSpline(c, jitter(SP_CARA, r, 1.2)); c.fillStyle = 'rgba(46,36,28,0.5)'; c.fill(); }
  c.save(); c.beginPath(); closedSpline(c, SP_CARA); c.clip();
  const cg = c.createRadialGradient(22, -6, 2, 20, 0, 28);
  cg.addColorStop(0, 'rgba(150,120,90,0.35)'); cg.addColorStop(1, 'rgba(10,6,2,0.35)');
  c.fillStyle = cg; c.fillRect(-10, -26, 60, 52);
  // pale hair band around the margin
  c.beginPath(); closedSpline(c, SP_CARA); c.lineWidth = 6; c.strokeStyle = 'rgba(206,182,140,0.35)'; c.stroke();
  // stipple
  c.beginPath();
  for (let i = 0; i < 260; i++) { const x = -8 + r() * 54, y = -24 + r() * 48; c.moveTo(x + 0.4, y); c.arc(x, y, 0.4, 0, TAU); }
  c.fillStyle = 'rgba(10,6,2,0.5)'; c.fill();
  c.restore();
  c.beginPath(); closedSpline(c, SP_CARA); c.lineWidth = 0.9; c.strokeStyle = '#120c07'; c.stroke();
  // chelicerae, metallic green
  for (const s of [-1, 1]) {
    c.beginPath(); c.ellipse(47.5, s * 5.2, 4.6, 3.8, 0, 0, TAU);
    const g = c.createLinearGradient(44, s * 2, 51, s * 8);
    g.addColorStop(0, '#2f8a7c'); g.addColorStop(0.5, '#86c9a8'); g.addColorStop(1, '#1d4f4a');
    c.fillStyle = g; c.fill(); c.lineWidth = 0.6; c.strokeStyle = '#120c07'; c.stroke();
  }
  // eyes: big anterior medians, laterals, posterior row
  const glint = 0.7 + 0.3 * alert;
  for (const [x, y, rr] of [[41.5, -7.2, 6.4], [41.5, 7.2, 6.4], [38.5, -16.2, 3.3], [38.5, 16.2, 3.3], [29.5, -18.4, 1.1], [29.5, 18.4, 1.1], [19.5, -18.6, 3.0], [19.5, 18.6, 3.0]]) {
    c.beginPath(); c.arc(x, y, rr, 0, TAU);
    const g = c.createRadialGradient(x - rr * 0.3, y - rr * 0.3, rr * 0.1, x, y, rr);
    g.addColorStop(0, '#4a4038'); g.addColorStop(0.6, '#140d08'); g.addColorStop(1, '#050302');
    c.fillStyle = g; c.fill(); c.lineWidth = 0.6; c.strokeStyle = '#000'; c.stroke();
    c.beginPath(); c.ellipse(x - rr * 0.35, y - rr * 0.35, rr * 0.32, rr * 0.2, -0.6, 0, TAU);
    c.fillStyle = `rgba(255,255,255,${0.85 * glint})`; c.fill();
  }
  c.restore();
}

// ============================================================ the other seven things in the arena (plate units, centred)
function softShadow(c, pts, r, dx = 7, dy = 9) {
  for (let i = 0; i < 4; i++) {
    c.beginPath(); closedSpline(c, jitter(pts.map(([x, y]) => [x + dx + i, y + dy + i]), r, 2));
    c.fillStyle = 'rgba(96,66,34,0.05)'; c.fill();
  }
}
function wash(c, pts, r, col, n = 3, amp = 1.5) {
  c.fillStyle = col;
  for (let i = 0; i < n; i++) { c.beginPath(); closedSpline(c, jitter(pts, r, amp)); c.fill(); }
}
function ink(c, pts, r, w = 1.15) {
  c.beginPath(); closedSpline(c, pts); c.lineWidth = w; c.strokeStyle = INK; c.stroke();
  c.beginPath(); closedSpline(c, jitter(pts, r, 0.8)); c.lineWidth = w * 0.5; c.strokeStyle = 'rgba(36,24,13,0.4)'; c.stroke();
}
function polar(n, R, f, cx = 0, cy = 0) {
  return Array.from({ length: n }, (_, i) => { const a = i / n * TAU, rr = R * f(a); return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]; });
}
function stippleIn(c, pts, r, n, bx, col, dens) {
  c.beginPath();
  for (let i = 0; i < n; i++) {
    const x = bx[0] + r() * (bx[2] - bx[0]), y = bx[1] + r() * (bx[3] - bx[1]);
    if (!inPoly(pts, x, y) || r() > dens(x, y)) continue;
    c.moveTo(x + 0.55, y); c.arc(x, y, 0.42 + r() * 0.3, 0, TAU);
  }
  c.fillStyle = col; c.fill();
}

function drawBanana(c) {
  const r = rng(21), top = [], bot = [], mid = [];
  const R = 118;
  for (let i = 0; i <= 20; i++) {
    const u = i / 20, a = lerp(-0.7, 0.7, u);
    const cx = Math.sin(a) * R, cy = R * 0.86 - Math.cos(a) * R + 2;
    const nx = Math.sin(a), ny = -Math.cos(a), w = 19 * (0.5 + 0.5 * Math.sin(Math.PI * u)) + 9;
    top.push([cx + nx * w, cy + ny * w]); bot.push([cx - nx * w, cy - ny * w]); mid.push([cx, cy]);
  }
  const out = top.concat(bot.slice().reverse());
  softShadow(c, out, r);
  wash(c, out, r, 'rgba(246,234,186,0.6)');
  c.save(); c.beginPath(); closedSpline(c, out); c.clip();
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath(); openSpline(c, top); c.lineWidth = 15; c.strokeStyle = 'rgba(226,190,58,0.92)'; c.stroke();
  c.beginPath(); openSpline(c, top.map(([x, y], i) => [x - (x - mid[i][0]) * 0.32, y - (y - mid[i][1]) * 0.32])); c.lineWidth = 1.4; c.strokeStyle = 'rgba(150,118,30,0.7)'; c.stroke();
  // fibres and the seed line
  for (const f of [-0.45, 0.45]) {
    c.beginPath(); openSpline(c, mid.map(([x, y], i) => [x + (bot[i][0] - x) * f * 0.8, y + (bot[i][1] - y) * f * 0.8]));
    c.lineWidth = 0.7; c.strokeStyle = 'rgba(200,170,90,0.6)'; c.stroke();
  }
  c.beginPath();
  for (let i = 2; i < 19; i++) { const [x, y] = mid[i]; c.moveTo(x + 1.3, y); c.arc(x, y, 1.1, 0, TAU); }
  c.fillStyle = 'rgba(90,60,30,0.6)'; c.fill();
  // brown, slightly oxidised cut ends
  for (const i of [0, 20]) { const g = c.createRadialGradient(mid[i][0], mid[i][1], 2, mid[i][0], mid[i][1], 22); g.addColorStop(0, 'rgba(170,120,60,0.45)'); g.addColorStop(1, 'rgba(170,120,60,0)'); c.fillStyle = g; c.fillRect(mid[i][0] - 24, mid[i][1] - 24, 48, 48); }
  c.restore();
  stippleIn(c, out, r, 700, [-110, -60, 110, 40], 'rgba(110,80,30,0.5)', (x, y) => 0.18 + 0.5 * Math.abs(x) / 110);
  ink(c, out, r);
}

function drawHoney(c) {
  const r = rng(31);
  const pts = polar(30, 50, a => 1 + 0.13 * Math.sin(3 * a + 1) + 0.07 * Math.sin(5 * a + 2) + 0.04 * Math.sin(9 * a), -4, 0);
  const drip = polar(14, 11, a => 1 + 0.1 * Math.sin(3 * a), 48, 30);
  softShadow(c, pts, r, 4, 6);
  for (const p of [pts, drip]) {
    const g = c.createRadialGradient(-16, -14, 2, -4, 0, 58);
    g.addColorStop(0, 'rgba(246,200,96,0.95)'); g.addColorStop(0.55, 'rgba(222,146,40,0.9)'); g.addColorStop(1, 'rgba(160,90,22,0.95)');
    c.fillStyle = g;
    for (let i = 0; i < 2; i++) { c.beginPath(); closedSpline(c, jitter(p, r, 1.2)); c.fill(); }
    c.beginPath(); closedSpline(c, p); c.lineWidth = 3; c.strokeStyle = 'rgba(130,64,14,0.5)'; c.stroke();
    c.lineWidth = 0.9; c.strokeStyle = INK; c.stroke();
  }
  // gloss, bubbles
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(-36, -8); c.quadraticCurveTo(-34, -34, -10, -38); c.lineWidth = 5; c.strokeStyle = 'rgba(255,250,232,0.8)'; c.stroke();
  c.beginPath(); c.moveTo(20, 26); c.quadraticCurveTo(30, 20, 34, 8); c.lineWidth = 2.2; c.strokeStyle = 'rgba(255,250,232,0.55)'; c.stroke();
  for (const [x, y, rr] of [[8, -12, 3.2], [16, 4, 2], [-12, 16, 2.6], [22, -20, 1.6], [-22, 2, 1.4]]) {
    c.beginPath(); c.arc(x, y, rr, 0, TAU); c.lineWidth = 0.8; c.strokeStyle = 'rgba(255,240,200,0.9)'; c.stroke();
    c.beginPath(); c.arc(x - rr * 0.35, y - rr * 0.35, rr * 0.3, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.9)'; c.fill();
  }
}

function drawWine(c) {
  const r = rng(41);
  const pts = polar(32, 54, a => 1 + 0.16 * Math.sin(2 * a + 0.5) + 0.08 * Math.sin(5 * a + 1) + 0.05 * Math.sin(11 * a), -12, 10);
  // rosy bloom where the wine wicked into the paper
  c.beginPath(); closedSpline(c, polar(32, 62, a => 1 + 0.16 * Math.sin(2 * a + 0.5) + 0.1 * Math.sin(6 * a), -12, 10));

function drawFlytrap(c) {
  const r = rng(81);
  c.beginPath(); closedSpline(c, polar(16, 24, a => 1 + 0.12 * Math.sin(3 * a))); c.fillStyle = 'rgba(107,82,56,0.55)'; c.fill();
  const n = 6;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + (r() - 0.5) * 0.4, open = i % 3 === 1 ? 0.25 : 0.7 + r() * 0.3;
    c.save(); c.rotate(a);
    // petiole: a flat winged leaf stalk
    const pet = [[8, 0], [20, -7], [40, -12], [55, -6], [60, 0], [55, 6], [40, 12], [20, 7]];
    c.beginPath(); closedSpline(c, pet); c.fillStyle = 'rgba(126,160,74,0.85)'; c.fill(); c.lineWidth = 0.9; c.strokeStyle = INK; c.stroke();
    c.beginPath(); c.moveTo(10, 0); c.lineTo(58, 0); c.lineWidth = 0.7; c.strokeStyle = 'rgba(60,80,30,0.6)'; c.stroke();
    // the trap: two lobes hinged on the midrib
    c.translate(84, 0);
    const rx = 25, ry = 19 * (0.55 + 0.45 * open), gap = 1.6;
    for (const s of [-1, 1]) {
      c.beginPath(); c.ellipse(0, s * gap, rx, ry, 0, s < 0 ? Math.PI : 0, s < 0 ? TAU : Math.PI); c.closePath();
      c.fillStyle = '#86aa4e'; c.fill(); c.lineWidth = 0.9; c.strokeStyle = INK; c.stroke();
      c.beginPath(); c.ellipse(0, s * gap, rx * 0.8, ry * 0.74, 0, s < 0 ? Math.PI : 0, s < 0 ? TAU : Math.PI); c.closePath();
      const g = c.createRadialGradient(0, s * (gap + ry * 0.2), 1, 0, s * gap, rx);
      g.addColorStop(0, '#d0484a'); g.addColorStop(1, '#8e1f2a'); c.fillStyle = g; c.fill();
      // trigger hairs
      for (const [hx, hy] of [[-8, 0.35], [2, 0.5], [10, 0.3]]) { c.beginPath(); c.arc(hx, s * (gap + ry * hy), 0.9, 0, TAU); c.fillStyle = 'rgba(255,230,200,0.9)'; c.fill(); }
      // cilia along the free margin
      c.beginPath();
      for (let q = 1; q < 14; q++) {
        const th = (s < 0 ? Math.PI : 0) + q / 14 * Math.PI, ex = Math.cos(th) * rx, ey = s * gap + Math.sin(th) * ry;
        const nx = Math.cos(th) / rx, ny = Math.sin(th) / ry, nl = Math.hypot(nx, ny);
        c.moveTo(ex, ey); c.lineTo(ex + nx / nl * 7, ey + ny / nl * 7);
      }
      c.lineWidth = 0.8; c.strokeStyle = 'rgba(70,96,34,0.95)'; c.stroke();
    }
    c.restore();
  }
}

function drawObjectType(c, t) {

// ============================================================ data
const ST = window.STORY;
const NAMES = ST.names, NFOOD = ST.food_types, NSTEP = ST.config.steps, AR = ST.config.arena;
const RUNS = ['shared', 'naive'];
const isBad = t => t >= NFOOD;
const FEAT = ST.featured.fly;
const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtBytes = b => b < 1e3 ? `${b} B` : b < 1e6 ? `${(b / 1e3).toFixed(0)} KB` : `${(b / 1e6).toFixed(2)} MB`;

// ============================================================ plate layout (plate units, 1600 x 1000)
const BAR = 58;                                  // controls strip under the plate (css px)
const MAIN = { x: 40, y: 150, w: 1010, h: 640 };
const INSET = { x: 1086, y: 58, w: 474, h: 252 };
const MAP = { x: 1090, y: 400, w: 200, h: 200 };
const CARD = { x: 1080, y: 636, w: 482, h: 322 };
const CAM = 42, CAM_I = 16;                      // plate units per arena unit (main, inset)

// ============================================================ objects through time
function holdKind(run, e) {
  if (run === 'shared') return { ask: 'ask', local: 'local', eat: 'eat', novel: 'novel' }[e.k] || null;
  if (e.k === 'sting') return e.dead ? 'death' : 'sting';
  if (e.k === 'eat') return 'eatN';
  return null;
}
function buildInstances(run) {
  const f = ST[run].fly;
  const cur = f.obj_pos.map((p, m) => ({ m, x: p[0], y: p[1], t: f.obj_type[m], s0: 0, s1: Infinity, cause0: 'start', cause1: null }));
  const all = cur.slice();
  for (const e of f.events) {
    if (e.k !== 'spawn' && e.k !== 'novel') continue;
    const old = cur[e.m];
    const why = e.k === 'novel' ? 'novel' : ((f.events.find(q => q.s === e.s && q.m === e.m && (q.k === 'eat' || q.k === 'sting')) || {}).k || 'spawn');
    old.s1 = e.s; old.cause1 = why;
    const n = { m: e.m, x: e.x, y: e.y, t: e.t, s0: e.s, s1: Infinity, cause0: why, cause1: null };
    cur[e.m] = n; all.push(n);
  }
  all.forEach((o, i) => { const r = rng(1000 + i * 7 + o.m); o.rot = (r() - 0.5) * ([5, 6, 7].includes(o.t) ? TAU : 0.9); });
  return all;
}
const INST = { shared: buildInstances('shared'), naive: buildInstances('naive') };
function instAt(run, m, k) {
  return INST[run].filter(o => o.m === m && o.s0 <= k && o.s1 >= k).sort((a, b) => a.s0 - b.s0)[0];
}

// ============================================================ the recorded path, as a curve
function crPts(path, k) {
  const P = path.P, n = path.n, p1 = P[k], p2 = P[k + 1];
  const p0 = (!path.piv[k] && k > 0) ? P[k - 1] : [2 * p1[0] - p2[0], 2 * p1[1] - p2[1]];
  const p3 = (!path.piv[k + 1] && k + 2 < n) ? P[k + 2] : [2 * p2[0] - p1[0], 2 * p2[1] - p1[1]];
  return [p0, p1, p2, p3];
}
function crPos(path, k, u) {
  const [p0, p1, p2, p3] = crPts(path, k), u2 = u * u, u3 = u2 * u;
  const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
  return [f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])];
}
function crTan(path, k, u) {
  const [p0, p1, p2, p3] = crPts(path, k), u2 = u * u;
  const f = (a, b, c, d) => 0.5 * ((-a + c) + 2 * (2 * a - 5 * b + 4 * c - d) * u + 3 * (-a + 3 * b - 3 * c + d) * u2);

}
function prepPath(run) {
  const P = ST[run].fly.pos, n = P.length;
  const ev = new Set(ST[run].fly.events.filter(e => holdKind(run, e)).map(e => e.s));
  const dir = [];
  for (let k = 0; k < n - 1; k++) { const dx = P[k + 1][0] - P[k][0], dy = P[k + 1][1] - P[k][1]; dir.push(Math.hypot(dx, dy) > 1e-4 ? Math.atan2(dy, dx) : null); }
  const piv = new Uint8Array(n); piv[0] = 1; piv[n - 1] = 1;
  for (let k = 1; k < n - 1; k++) {
    if (ev.has(k)) piv[k] = 1;
    else if (dir[k - 1] !== null && dir[k] !== null && Math.abs(wrapA(dir[k] - dir[k - 1])) > deg(58)) piv[k] = 1;
    else if (dir[k] === null || dir[k - 1] === null) piv[k] = 1;
  }
  const path = { P, n, dir, piv };
  const hIn = new Float64Array(n).fill(NaN), hOut = new Float64Array(n).fill(NaN);
  for (let k = 0; k < n; k++) {
    if (k < n - 1 && dir[k] !== null) hOut[k] = crTan(path, k, 0);
    if (k > 0 && dir[k - 1] !== null) hIn[k] = crTan(path, k - 1, 1);
  }
  let h = dir.find(d => d !== null) ?? 0;
  for (let k = 0; k < n; k++) {
    if (isNaN(hIn[k])) hIn[k] = h; h = hIn[k];
    if (isNaN(hOut[k])) hOut[k] = h; h = hOut[k];

function stateText(F, run) {
  const seg = F.seg;
  if (run === 'naive' && F.flip > 0.5) return 'on its back';
  if (seg.type === 'walk') return 'walking';
  const st = seg.st[run], ht = F.o ? F.o.ht : 0;
  const name = st.obj ? NAMES[st.obj.t] : '';
  switch (st.prog) {
    case 'pivot': return 'turning on the spot';
    case 'ask': return ht < 3.6 ? 'asking the fleet about a smell' : st.danger ? (ht < 6 ? 'backing off' : 'grooming, a little rattled') : 'going for it';
    case 'local': return 'remembers this smell itself';
    case 'eat': return `eating the ${name}`;
    case 'eatN': return `eating the ${name}`;
    case 'sting': return ht < 1 ? `stung by the ${name}` : 'grooming, hurt';

    case 'novel': return 'a new smell in the world';

}

    else if (seg.kind === 'local') { col = '#8a7a66'; tip = `step ${e.s}: remembered it, nothing sent`; }
    else if (seg.kind === 'eat') { col = '#b8862a'; tip = `step ${e.s}: ate the ${NAMES[e.t]}`; }
    else if (seg.kind === 'novel') { col = '#6b3f8a'; tip = 'step 200: the Venus flytrap appears'; }
    else if (seg.kind === 'sting' || seg.kind === 'death') { col = '#24180d'; tip = `step ${e.s}: the twin, alone, is stung${seg.kind === 'death' ? ' a third time' : ''}`; m.className = 'tw'; }
    else if (seg.kind === 'eatN') { col = '#c9b48a'; tip = `step ${e.s}: the twin eats`; m.className = 'tw'; }
    m.style.left = (seg.t0 / TLN.T * 100) + '%'; m.style.background = col; m.title = tip;
    m.onclick = () => { setTau(seg.t0); };

}
function setTau(t) { trans = -1; tauNow = clamp(t, 0, TLN.T - 1e-6); frame(tauNow); syncUI(); }
function syncUI() {
  $('scrub').value = String(tauNow / TLN.T * 1000);
  const s = Math.floor(bodyAt('shared', tauNow).s + 1e-9);
  $('stepv').textContent = `step ${s} of ${NSTEP}`;
  $('play').textContent = playing ? 'Pause' : 'Play';
}
function setPlaying(p) { playing = p; if (p && tauNow >= TLN.T - 0.05 && trans < 0) tauNow = 0; syncUI(); }
$('play').onclick = () => setPlaying(!playing);
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
  rate = +b.dataset.rate;
  document.querySelectorAll('[data-rate]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});
$('mode').onclick = () => {
  const m = TLN.mode === 'highlights' ? 'even' : 'highlights';
  rebuild(m);
  $('mode').textContent = m === 'highlights' ? 'Highlights' : 'Even pace';
  $('mode').setAttribute('aria-pressed', String(m === 'highlights'));
  frame(tauNow); syncUI();
};
$('scrub').oninput = () => { setTau(+$('scrub').value / 1000 * TLN.T); };
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { setPlaying(!playing); e.preventDefault(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    const dir = e.code === 'ArrowRight' ? 1 : -1;
    const ts = TLN.segs.filter(s => s.type === 'hold' && s.kind !== 'pivot').map(s => s.t0);
    const nxt = dir > 0 ? ts.find(t => t > tauNow + 0.01) : ts.filter(t => t < tauNow - 0.3).pop();
    if (nxt !== undefined) setTau(nxt);
  }
});

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round((VH - BAR) * DPR);
  cv.style.height = (VH - BAR) + 'px';
  S = Math.min(VW / W0, (VH - BAR) / H0); OX = (VW - W0 * S) / 2; OY = (VH - BAR - H0 * S) / 2;
  bg.width = cv.width; bg.height = cv.height;
  buildBg(); buildSprites();
}
window.addEventListener('resize', () => { resize(); frame(tauNow); });

rebuild('highlights');
const qs = new URLSearchParams(location.search);
resize();
if (qs.has('step')) tauNow = TLN.stepTau[clamp(parseInt(qs.get('step'), 10) || 0, 0, NSTEP - 1)];
else setPlaying(true);
if (document.fonts) {
  Promise.all(['italic 500 46px "Cormorant Garamond"', '400 19px "Cormorant Garamond"', '600 15px "Cormorant Garamond"', 'italic 400 17px "Cormorant Garamond"', '600 30px Caveat', '500 20px Caveat']
    .map(f => document.fonts.load(f))).catch(() => {}).then(() => { buildBg(); buildSprites(); frame(tauNow); });
}
// looping: hold the end card, then a page turns over the plate and the run starts again at step 0.
// Everything on screen is a pure function of playback time, so nothing piles up from one loop to the next.
const LOOPING = qs.get('loop') !== '0', TRANS = 1.3;
function drawWipe(p) {
  const W = cv.width, H = cv.height;
  const q = p < 0.5 ? sstep(p * 2) : sstep((p - 0.5) * 2);
  const x0 = p < 0.5 ? W * (1 - q) : 0, x1 = p < 0.5 ? W : W * (1 - q);
  if (x1 - x0 < 1) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  // soft shadow ahead of the turning page
  const ex = p < 0.5 ? x0 : x1, dir = p < 0.5 ? -1 : 1, sw = 60 * DPR;
  const g = ctx.createLinearGradient(ex, 0, ex + dir * sw, 0);
  g.addColorStop(0, 'rgba(70,46,20,0.28)'); g.addColorStop(1, 'rgba(70,46,20,0)');
  ctx.fillStyle = g; ctx.fillRect(Math.min(ex, ex + dir * sw), 0, sw, H);
  ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, H); ctx.clip();
  ctx.drawImage(bg, 0, 0);
  // the page's curled edge catches the light
  const g2 = ctx.createLinearGradient(ex, 0, ex - dir * 40 * DPR, 0);
  g2.addColorStop(0, 'rgba(255,252,240,0.9)'); g2.addColorStop(1, 'rgba(255,252,240,0)');
  ctx.fillStyle = g2; ctx.fillRect(Math.min(ex, ex - dir * 40 * DPR), 0, 40 * DPR, H);
  ctx.restore();
}
function loop(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (playing) {
    if (trans >= 0) {
      trans += dt;
      if (trans >= TRANS / 2) tauNow = 0;
      if (trans >= TRANS) trans = -1;
    } else {
      tauNow += dt * rate;
      if (tauNow >= TLN.T - 1e-3) { tauNow = TLN.T - 1e-3; if (LOOPING) trans = 0; else playing = false; }
    }
  }
  frame(tauNow);
  if (trans >= 0) drawWipe(trans / TRANS);
  syncUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// test hooks: seek(step) lands exactly on that recorded step
window.seek = step => { playing = false; setTau(TLN.stepTau[clamp(Math.round(step), 0, NSTEP - 1)]); return Math.floor(bodyAt('shared', tauNow).s + 1e-9); };
window.seekTime = t => { playing = false; setTau(t); return tauNow; };
window.play = () => setPlaying(true);
window.__fp = { get TLN() { return TLN; }, get TLR() { return TLR; }, get GAIT() { return GAIT; }, get tau() { return tauNow; }, get trans() { return trans; }, get playing() { return playing; },
  setRate: r => { rate = r; }, bodyAt, flyState, PATH, INST, ST, holdAt: getHold, LOOPING };

})();
