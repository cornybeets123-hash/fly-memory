[project]
name = "fly-memory-workshop"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.2",
    "numpy>=2.4.6",
    "qdrant-edge-py==0.8.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["_internal/tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["_internal/archive"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
