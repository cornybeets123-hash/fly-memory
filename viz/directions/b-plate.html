<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ece1c8; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .cap {
    position: fixed; left: 16px; bottom: 10px;
    font: italic 500 14px/1 "Cormorant Garamond", Georgia, serif;
    color: #5a4430; letter-spacing: .02em; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c" aria-label="An animated entomology plate: a fruit fly finds an apple, then meets a spider and asks a shared memory whether that smell is dangerous."></canvas>
<div class="cap">Direction B · Scientific illustration (2D)</div>
<script>
(() => {
'use strict';

// ============================================================ helpers
const TAU = Math.PI * 2;
const W0 = 1600, H0 = 1000;          // plate (world) size
const DT = 1 / 240;                   // simulation step
const FS = 1.4;                       // fly units -> world units
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = t => (t = clamp(t, 0, 1), t * t * (3 - 2 * t));
const sstep5 = t => (t = clamp(t, 0, 1), t * t * t * (t * (t * 6 - 15) + 10));
const easeIO = t => 0.5 - 0.5 * Math.cos(Math.PI * clamp(t, 0, 1));
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const mod = (a, n) => ((a % n) + n) % n;
const deg = d => d * Math.PI / 180;
const win = (t, a, b, fi, fo) => clamp(Math.min((t - a) / fi, (b - t) / fo), 0, 1);
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function closedSpline(c, p) {
  const n = p.length;
  c.moveTo(p[0][0], p[0][1]);
  for (let i = 0; i < n; i++) {
    const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  c.closePath();
}
function openSpline(c, p, move = true) {
  const n = p.length;
  if (move) c.moveTo(p[0][0], p[0][1]);
  for (let i = 0; i < n - 1; i++) {
    const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(n - 1, i + 2)];
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
}
// half outline from front centre, down the left (-y) side, to the back centre -> full loop
function mirror(half) {
  const back = half.slice(1, -1).reverse().map(([x, y]) => [x, -y]);
  return half.concat(back);
}
function jitter(pts, r, amp) { return pts.map(([x, y]) => [x + (r() - 0.5) * 2 * amp, y + (r() - 0.5) * 2 * amp]); }
function inPoly(pts, x, y) {
  let ins = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
// tapered limb segment outline (adds to current path)
function segPath(c, a, b, w0, wm, w1) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1e-6;
  const nx = -dy / l, ny = dx / l, ang = Math.atan2(ny, nx);
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const k = wm - (w0 + w1) / 4;
  c.moveTo(a[0] + nx * w0 / 2, a[1] + ny * w0 / 2);
  c.quadraticCurveTo(mx + nx * k, my + ny * k, b[0] + nx * w1 / 2, b[1] + ny * w1 / 2);
  c.arc(b[0], b[1], w1 / 2, ang, ang - Math.PI, true);
  c.quadraticCurveTo(mx - nx * k, my - ny * k, a[0] - nx * w0 / 2, a[1] - ny * w0 / 2);
  c.arc(a[0], a[1], w0 / 2, ang + Math.PI, ang, true);
  c.closePath();
}

// ============================================================ palette
const INK = '#24180d', SEPIA = '#5a4430', RED = '#9b2a1f', PAPER = '#efe5cd';
const COL = {
  leg: '#bb8c56', legD: '#6e4826', legHi: 'rgba(255,238,205,0.55)',
  thx0: '#e3b779', thx1: '#b8824a', thx2: '#7a4f28',
  abd0: '#ecca93', abd1: '#c79a5e', abd2: '#8e6338', band: '#37241430',
};

// ============================================================ scene layout (world units)
const APPLE = { x: 478, y: 640, rot: -0.1, s: 1.2 };
const SPIDER = { x: 1078, y: 296, h: deg(138), s: 1.6 };
const CARD = { x: 1272, y: 588, w: 292, h: 350, rot: -0.022 };
const LOUPE = { x: 1428, y: 280, r: 150, k: 2.0 };

// ============================================================ the script (body path)
const segs = [];
let cur, tc = 0;
const TL = {};
function push(d, at) { segs.push({ t0: tc, t1: tc + d, at }); tc += d; }
function wait(d) { const p = { ...cur }; push(d, () => p); }
function turn(dh, d) {
  const p = { ...cur };
  push(d, u => ({ x: p.x, y: p.y, h: p.h + dh * easeIO(u) }));
  cur = { ...p, h: p.h + dh };
}
function turnTo(h, d) { turn(wrapA(h - cur.h), d); }
function back(dist, d) {
  const p = { ...cur }, dx = Math.cos(p.h), dy = Math.sin(p.h);
  push(d, u => { const s = sstep(u) * dist; return { x: p.x - dx * s, y: p.y - dy * s, h: p.h + 0.12 * Math.sin(Math.PI * u) }; });
  cur = { x: p.x - dx * dist, y: p.y - dy * dist, h: p.h };
}
function walk(x, y, hEnd, speed, k = 0.42) {
  const p = { ...cur };
  const d = Math.hypot(x - p.x, y - p.y);
  const c1 = { x: p.x + Math.cos(p.h) * d * k, y: p.y + Math.sin(p.h) * d * k };
  const c2 = { x: x - Math.cos(hEnd) * d * k, y: y - Math.sin(hEnd) * d * k };
  const n = 400, pts = [], cum = [0];
  for (let i = 0; i <= n; i++) {
    const u = i / n, a = (1 - u) ** 3, b = 3 * (1 - u) ** 2 * u, cc = 3 * (1 - u) * u * u, e = u ** 3;
    pts.push([a * p.x + b * c1.x + cc * c2.x + e * x, a * p.y + b * c1.y + cc * c2.y + e * y]);
    if (i) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  const L = cum[n], ta = 0.3, T = L / speed + ta;
  const m = 500, prof = [0];
  for (let i = 1; i <= m; i++) { const tau = (i - 0.5) / m * T; prof.push(prof[i - 1] + sstep(tau / ta) * sstep((T - tau) / ta)); }
  const tot = prof[m];
  const heads = pts.map((q, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n, i + 1)];
    return Math.atan2(b[1] - a[1], b[0] - a[0]);
  });
  let hp = p.h;
  for (let i = 0; i <= n; i++) { heads[i] = hp + wrapA(heads[i] - hp); hp = heads[i]; }
  push(T, u => {
    const fi = u * m, i0 = Math.min(m - 1, Math.floor(fi));
    const s = lerp(prof[i0], prof[i0 + 1], fi - i0) / tot * L;
    let lo = 0, hi = n;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= s) lo = mid; else hi = mid; }
    const w = (s - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
    return { x: lerp(pts[lo][0], pts[hi][0], w), y: lerp(pts[lo][1], pts[hi][1], w), h: lerp(heads[lo], heads[hi], w) };
  });
  cur = { x, y, h: heads[n] };
}

const P0 = { x: 760, y: 712, h: deg(-150) };
const PF = { x: 522, y: 640 };                 // feeding spot
const PB = { x: 712, y: 600 };                 // mid-way pause
const PS = { x: 866, y: 482 };                 // stops short of the spider
cur = { ...P0 };
wait(0.55);
walk(650, 556, deg(-100), 168);
TL.whiff0 = tc;
wait(0.45);
turnTo(Math.atan2(PF.y - cur.y, PF.x - cur.x), 0.8);
TL.whiff1 = tc;
walk(PF.x, PF.y, deg(176), 150);
TL.feed0 = tc;
wait(3.0);
TL.feed1 = tc;
turnTo(Math.atan2(PB.y - cur.y, PB.x - cur.x), 0.95);
walk(PB.x, PB.y, deg(-16), 162);
TL.pause0 = tc;
wait(0.4);
const hS = Math.atan2(SPIDER.y - PS.y, SPIDER.x - PS.x);
walk(PS.x, PS.y, hS, 140);
TL.stop = tc;
wait(3.7);
TL.back0 = tc;
back(62, 0.8);
TL.back1 = tc;
turnTo(Math.atan2(P0.y - cur.y, P0.x - cur.x) , 0.8);
walk(P0.x, P0.y, P0.h, 168);
TL.home = tc;
TL.groom0 = tc + 0.15;
TL.groom1 = TL.groom0 + 2.6;
const LOOP = Math.ceil((TL.groom1 + 0.45) * 10) / 10;
wait(LOOP - tc);

function poseAt(t) {
  t = mod(t, LOOP);
  for (const s of segs) if (t < s.t1) return s.at((t - s.t0) / (s.t1 - s.t0));
  const s = segs[segs.length - 1];
  return s.at(1);
}
function toWorld(P, l) {
  const c = Math.cos(P.h), s = Math.sin(P.h);
  return [P.x + (c * l[0] - s * l[1]) * FS, P.y + (s * l[0] + c * l[1]) * FS];
}
const groomW = t => sstep(win(mod(t, LOOP), TL.groom0, TL.groom1, 0.3, 0.35));

// ============================================================ legs: anatomy + tripod gait simulation
// fly units: x forward, y to the fly's right. Body length ~108 (head 39.5 .. abdomen -68.3)
const LEGDEF = [
  { hip: [15, -5.5], n: [52, -31], f: 21, t: 20, ts: 15, side: -1, tri: 0, name: 'L1' },
  { hip: [15, 5.5],  n: [52, 31],  f: 21, t: 20, ts: 15, side: 1,  tri: 1, name: 'R1' },
  { hip: [4, -7.5],  n: [6, -51],  f: 20, t: 21, ts: 15, side: -1, tri: 1, name: 'L2' },
  { hip: [4, 7.5],   n: [6, 51],   f: 20, t: 21, ts: 15, side: 1,  tri: 0, name: 'R2' },
  { hip: [-6, -6.5], n: [-40, -44], f: 23, t: 24, ts: 16, side: -1, tri: 0, name: 'L3' },
  { hip: [-6, 6.5],  n: [-40, 44],  f: 23, t: 24, ts: 16, side: 1,  tri: 1, name: 'R3' },
];
const SW = 0.36, STRIDE = 37, RTURN = 50;     // swing fraction, world stride, turning radius
const NS = Math.round(LOOP / DT);
const recX = new Float32Array(NS), recY = new Float32Array(NS), recH = new Float32Array(NS);
const recPh = new Float32Array(NS), recDr = new Float32Array(NS), recF = new Float32Array(NS * 18);
const prints = [];

(function simulate() {
  const p0 = poseAt(0);
  const legs = LEGDEF.map(L => { const w = toWorld(p0, L.n); return { x: w[0], y: w[1], sw: false, sx: 0, sy: 0, tx: 0, ty: 0, ph0: 0, win: -1e9, lift: 0 }; });
  let ph = 0, still = 0;
  const minRate = SW / 0.095;
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < NS; i++) {
      const t = i * DT;
      const P = poseAt(t), Q = poseAt(t - DT);
      const v = Math.hypot(P.x - Q.x, P.y - Q.y) / DT, w = Math.abs(wrapA(P.h - Q.h)) / DT;
      const drive = v + w * RTURN, moving = drive > 4;
      const grooming = groomW(t) > 0;
      let maxErr = 0;
      legs.forEach((g, k) => {
        if ((grooming && k < 2) || g.sw) return;
        const n = toWorld(P, LEGDEF[k].n);
        maxErr = Math.max(maxErr, Math.hypot(g.x - n[0], g.y - n[1]));
      });
      still = moving ? 0 : still + DT;
      const anySw = legs.some(g => g.sw);
      let rate = drive / STRIDE;
      if (anySw) rate = Math.max(rate, minRate);
      else if (!moving) rate = (still > 0.12 && maxErr > 1.0) ? minRate : 0;
      ph += rate * DT;
      for (let k = 0; k < 6; k++) {
        const L = LEGDEF[k], g = legs[k];
        if (grooming && k < 2 && !g.sw) { g.lift = 0; continue; }
        const w0 = L.tri ? 0.5 : 0, rel = ph - w0, wi = Math.floor(rel), loc = rel - wi;
        if (!g.sw && loc < SW && g.win !== wi && rate > 0) {
          g.win = wi;
          const nNow = toWorld(P, L.n);
          const err = Math.hypot(g.x - nNow[0], g.y - nNow[1]);
          if (!(drive < 25 && err < 1.0)) {
            const rEff = Math.max(rate, minRate);
            const tLand = t + (SW - loc) / rEff;
            const nominal = drive / STRIDE;
            const lead = nominal > 0.3 ? Math.min(0.3, (1 - SW) / 2 / nominal) : 0.05;
            const tw = toWorld(poseAt(tLand + lead), L.n);
            Object.assign(g, { sw: true, sx: g.x, sy: g.y, tx: tw[0], ty: tw[1], ph0: w0 + wi });
          }
        }
        if (g.sw) {
          const p = (ph - g.ph0) / SW;
          if (p >= 1) {
            g.sw = false; g.x = g.tx; g.y = g.ty; g.lift = 0;
            if (pass === 1) prints.push({ t, x: g.x, y: g.y, k });
          } else {
            const e = sstep5(p);
            g.x = lerp(g.sx, g.tx, e); g.y = lerp(g.sy, g.ty, e); g.lift = Math.sin(Math.PI * p);
          }
        } else g.lift = 0;
      }
      if (pass === 1) {
        recX[i] = P.x; recY[i] = P.y; recH[i] = P.h; recPh[i] = ph; recDr[i] = drive;
        for (let k = 0; k < 6; k++) { recF[i * 18 + k * 3] = legs[k].x; recF[i * 18 + k * 3 + 1] = legs[k].y; recF[i * 18 + k * 3 + 2] = legs[k].lift; }
      }
    }
  }
})();

// ============================================================ per-frame fly state
const LIGHT = (() => { const l = Math.hypot(-0.55, -0.83); return [-0.55 / l, -0.83 / l]; })();
const SHADOW = [6, 8];
function rotV(v, a) { const c = Math.cos(a), s = Math.sin(a); return [c * v[0] - s * v[1], s * v[0] + c * v[1]]; }

function groomPose(t, k) {
  const s = k === 0 ? -1 : 1, tt = t - TL.groom0;
  const rub = Math.sin(TAU * 4.4 * tt);
  // tarsi cross over each other in front of the head and slide back and forth
  let x = 64 + 3.6 * rub * -s, y = -s * 3.0 + 0.9 * Math.cos(TAU * 4.4 * tt);
  let td = [0.84, -s * 0.54];
  // a sweep back over the eyes in the middle of the bout
  const hs = sstep(win(tt, 0.95, 1.85, 0.18, 0.18));
  if (hs > 0) {
    const c = 0.5 - 0.5 * Math.cos(TAU * 2 * (tt - 0.95) / 0.9 + (s > 0 ? 0.6 : 0));
    x = lerp(x, 37 - 11 * c, hs); y = lerp(y, s * 13.5, hs);
    td = [lerp(td[0], -0.9, hs), lerp(td[1], s * 0.25, hs)];
  }
  const l = Math.hypot(td[0], td[1]);
  return { x, y, td: [td[0] / l, td[1] / l] };
}

function flyState(t) {
  t = mod(t, LOOP);
  const fi = t / DT, i = Math.floor(fi) % NS, j = (i + 1) % NS, f = fi - Math.floor(fi);
  const x = lerp(recX[i], recX[j], f), y = lerp(recY[i], recY[j], f);
  const h = recH[i] + wrapA(recH[j] - recH[i]) * f;
  const ph = recPh[i], drive = recDr[i];
  const sf = clamp(drive / 130, 0, 1);
  const yaw = 0.03 * sf * Math.sin(TAU * ph);
  const bob = sf * (0.5 - 0.5 * Math.cos(2 * TAU * ph));
  const fw = sstep(win(t, TL.feed0 + 0.15, TL.feed1 - 0.05, 0.35, 0.3));
  const pump = 0.5 + 0.5 * Math.sin(TAU * 2.6 * t);
  const gw = groomW(t);
  let ox = fw * (0.6 + 0.9 * pump) + gw * 0.9 * Math.sin(TAU * 1.3 * (t - TL.groom0));
  const H = h + yaw, X = x + Math.cos(h) * ox * FS, Y = y + Math.sin(h) * ox * FS;
  const cH = Math.cos(H), sH = Math.sin(H);
  const legs = [];
  for (let k = 0; k < 6; k++) {
    const b = (i * 18 + k * 3), b2 = (j * 18 + k * 3);
    const fx = lerp(recF[b], recF[b2], f), fy = lerp(recF[b + 1], recF[b2 + 1], f), lift = lerp(recF[b + 2], recF[b2 + 2], f);
    const dx = (fx - X) / FS, dy = (fy - Y) / FS;
    legs.push({ x: dx * cH + dy * sH, y: -dx * sH + dy * cH, lift, wx: fx, wy: fy });
  }
  if (gw > 0) {
    for (let k = 0; k < 2; k++) {
      const gp = groomPose(t, k), L = legs[k];
      const hip = LEGDEF[k].hip;
      let ux = L.x - hip[0], uy = L.y - hip[1]; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
      L.x = lerp(L.x, gp.x, gw); L.y = lerp(L.y, gp.y, gw);
      const tx = lerp(ux, gp.td[0], gw), ty = lerp(uy, gp.td[1], gw), tl = Math.hypot(tx, ty) || 1;
      L.td = [tx / tl, ty / tl];
      L.lift = Math.max(L.lift, gw);
    }
  }
  // antennae: idle flicker, faster when smelling something
  const sniffA = win(t, TL.whiff0 - 0.1, TL.whiff1, 0.15, 0.3), sniffS = win(t, TL.stop - 0.2, TL.back0 + 0.2, 0.2, 0.3);
  const ant = 0.035 * Math.sin(TAU * 0.7 * t) + 0.13 * sniffA * Math.sin(TAU * 6 * t) + 0.11 * sniffS * Math.sin(TAU * 4.5 * t + 1);
  // head turns a little toward the smell
  const tgtA = Math.atan2(APPLE.y - Y, APPLE.x - 40 - X) - H, tgtS = Math.atan2(SPIDER.y - Y, SPIDER.x - X) - H;
  const headYaw = clamp(wrapA(tgtA), -0.2, 0.2) * sniffA + clamp(wrapA(tgtS), -0.18, 0.18) * sniffS + 0.05 * gw * Math.sin(TAU * 1.1 * (t - TL.groom0));
  // startle
  const buzz = win(t, TL.back0 - 0.04, TL.back0 + 0.5, 0.05, 0.16);
  const spread = win(t, TL.back0 - 0.12, TL.back0 + 0.62, 0.08, 0.12);
  return { t, X, Y, H, legs, bob, feed: fw * (0.72 + 0.28 * pump), groom: gw, buzz, spread, ant, headYaw, drive };
}

// ============================================================ fly drawing (fly units)
const THX = mirror([[27, 0], [25.6, -6.8], [21, -12.4], [13, -16], [3, -17], [-7, -16], [-13.5, -12.5], [-16.8, -6.5], [-17.5, 0]]);
const SCU = mirror([[-12.2, 0], [-12.8, -9.6], [-17.2, -9.6], [-22.4, -7], [-25.4, -3.2], [-26.3, 0]]);
const ABD = mirror([[-12, 0], [-12.8, -9.5], [-17.5, -15.8], [-26, -19.2], [-38, -19.9], [-50, -17.6], [-59.5, -12.5], [-65.5, -6.6], [-68.4, 0]]);
const HEAD = mirror([[39.8, 0], [39, -6.6], [36.4, -12.8], [31.6, -17.6], [25.6, -18.6], [21.4, -15.4], [20.4, -8], [22.6, 0]]);
const WL = 84;
const WOUT = [[0, 0], [0.08, 0.042], [0.2, 0.072], [0.35, 0.098], [0.5, 0.118], [0.65, 0.133], [0.78, 0.137], [0.88, 0.124], [0.95, 0.097], [0.99, 0.057], [1.0, 0.018],
  [0.99, -0.035], [0.955, -0.095], [0.89, -0.15], [0.8, -0.192], [0.68, -0.215], [0.55, -0.218], [0.42, -0.2], [0.3, -0.165], [0.2, -0.122], [0.145, -0.09], [0.118, -0.068], [0.09, -0.08], [0.05, -0.062], [0.018, -0.03]]
  .map(([u, v]) => [u * WL, v * WL]);
const VEINS = {

  L2:  [[0.045, 0.01], [0.2, 0.03], [0.4, 0.058], [0.6, 0.094], [0.73, 0.122], [0.8, 0.134]],
  L3:  [[0.045, 0.005], [0.25, 0.012], [0.5, 0.02], [0.75, 0.034], [0.92, 0.038], [0.997, 0.028]],
  L4:  [[0.035, -0.004], [0.2, -0.029], [0.42, -0.051], [0.63, -0.067], [0.82, -0.077], [0.968, -0.08]],
  L5:  [[0.03, -0.011], [0.15, -0.044], [0.35, -0.088], [0.55, -0.128], [0.7, -0.163], [0.795, -0.19]],

for (const k in VEINS) VEINS[k] = VEINS[k].map(([u, v]) => [u * WL, v * WL]);

// compound eye facets: hex grid in angle space, projected onto a dome (ellipse rx x ry)
const EYE = { cx: 29.8, cy: 11.5, rx: 9.6, ry: 7.4, rot: 0.1 };
const FACETS = (() => {
  const p = new Path2D(), glints = [];
  const a = 0.1, R = Math.PI / 2;
  const proj = (x, y) => { let r = Math.hypot(x, y); if (r > R) { x *= R / r; y *= R / r; r = R; } const k = r < 1e-6 ? 1 : Math.sin(r) / r; return [x * k * EYE.rx, y * k * EYE.ry]; };
  for (let i = -20; i <= 20; i++) for (let j = -20; j <= 20; j++) {
    const cx = 1.5 * a * i, cy = Math.sqrt(3) * a * (j + 0.5 * (i & 1));
    if (Math.hypot(cx, cy) > R * 0.985) continue;
    for (let q = 0; q < 6; q++) {
      const [x, y] = proj(cx + a * Math.cos(q * Math.PI / 3), cy + a * Math.sin(q * Math.PI / 3));
      q ? p.lineTo(x, y) : p.moveTo(x, y);
    }
    p.closePath();
    glints.push(proj(cx, cy));
  }
  return { p, glints };
})();

function legPts(k, Lg) {
  const L = LEGDEF[k], hx = L.hip[0], hy = L.hip[1], lift = Lg.lift || 0;
  const cx = Lg.x, cy = Lg.y;
  let ux, uy;
  if (Lg.td) { ux = Lg.td[0]; uy = Lg.td[1]; }
  else { ux = cx - hx; uy = cy - hy; const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l; }
  const ts = L.ts * (1 - 0.16 * lift);
  let ax = cx - ux * ts, ay = cy - uy * ts;
  let vx = ax - hx, vy = ay - hy; const vl = Math.hypot(vx, vy) || 1; vx /= vl; vy /= vl;
  const c0 = [hx, hy], c1 = [hx + vx * 4.5, hy + vy * 4.5];
  // two-bone IK, knee bends away from the body midline
  let dx = ax - c1[0], dy = ay - c1[1], d = Math.hypot(dx, dy) || 1e-3;
  const dc = clamp(d, Math.abs(L.f - L.t) + 0.5, L.f + L.t - 0.05);
  const a = (L.f * L.f - L.t * L.t + dc * dc) / (2 * dc), hh = Math.sqrt(Math.max(0, L.f * L.f - a * a));
  const nx = dx / d, ny = dy / d;
  const mx = c1[0] + nx * a, my = c1[1] + ny * a;
  const k1 = [mx - ny * hh, my + nx * hh], k2 = [mx + ny * hh, my - nx * hh];
  const knee = (k1[1] * L.side > k2[1] * L.side) ? k1 : k2;
  const ankle = [c1[0] + nx * dc, c1[1] + ny * dc];
  return { c0, c1, knee, ankle, claw: [cx, cy], lift };
}

function flyShadow(c, F) {
  const [sx, sy] = F.shOff, k = 1 + F.bob * 0.35;
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(78,54,30,0.09)'; c.lineWidth = 1.5;
  c.beginPath();
  for (let i = 0; i < 6; i++) {
    if (F.groom > 0.35 && i < 2) continue;
    const G = legPts(i, F.legs[i]), lf = G.lift * 1.4;
    const o = (p, hgt) => [p[0] + sx * (hgt + lf) * 0.9, p[1] + sy * (hgt + lf) * 0.9];
    const pts = [o(G.c1, 1.0), o(G.knee, 0.95), o(G.ankle, 0.3), o(G.claw, 0)];
    c.moveTo(pts[0][0], pts[0][1]);
    for (let q = 1; q < 4; q++) c.lineTo(pts[q][0], pts[q][1]);
  }
  c.stroke();
  c.translate(-15 + sx * k, sy * k);
  c.scale(1, 0.37);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 64);
  g.addColorStop(0, 'rgba(66,44,22,0.34)'); g.addColorStop(0.5, 'rgba(66,44,22,0.2)'); g.addColorStop(1, 'rgba(66,44,22,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 64, 0, TAU); c.fill();
  c.restore();
}

function drawLegs(c, F, idx) {
  const px = F.px, lw = Math.max(0.42, 0.6 * px);
  for (const k of idx) {
    const G = legPts(k, F.legs[k]);
    const { c0, c1, knee, ankle, claw } = G;
    // coxa, femur, tibia
    c.beginPath();
    segPath(c, c0, c1, 4.6, 5.0, 3.8);
    segPath(c, c1, knee, 3.3, 4.1, 2.7);
    segPath(c, knee, ankle, 2.5, 2.2, 1.7);
    c.fillStyle = COL.leg; c.fill();
    c.lineWidth = lw; c.strokeStyle = 'rgba(52,32,14,0.9)'; c.stroke();
    // lit edge on femur and tibia
    c.strokeStyle = COL.legHi; c.lineWidth = Math.max(0.45, 0.5 * px); c.lineCap = 'round';
    c.beginPath();
    for (const [a, b, w] of [[c1, knee, 3.4], [knee, ankle, 2.0]]) {
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
      const sgn = (nx * F.light[0] + ny * F.light[1]) > 0 ? 1 : -1, o = w * 0.22 * sgn;
      c.moveTo(a[0] + dx * 0.15 + nx * o, a[1] + dy * 0.15 + ny * o);
      c.lineTo(a[0] + dx * 0.85 + nx * o, a[1] + dy * 0.85 + ny * o);
    }
    c.stroke();
    // dark knee and ankle joints
    c.fillStyle = COL.legD;
    c.beginPath(); c.arc(knee[0], knee[1], 1.35, 0, TAU); c.arc(ankle[0], ankle[1], 0.95, 0, TAU); c.fill();
    // tarsus: five tarsomeres
    const tx = claw[0] - ankle[0], ty = claw[1] - ankle[1], tl = Math.hypot(tx, ty) || 1, ux = tx / tl, uy = ty / tl;
    const fr = [0, 0.36, 0.56, 0.72, 0.85, 1];
    c.beginPath();
    for (let q = 0; q < 5; q++) {
      const a = [ankle[0] + tx * fr[q] + ux * 0.25, ankle[1] + ty * fr[q] + uy * 0.25];
      const b = [ankle[0] + tx * fr[q + 1] - ux * 0.2, ankle[1] + ty * fr[q + 1] - uy * 0.2];
      const w = 1.35 - q * 0.1;
      segPath(c, a, b, w * 0.85, w, w * 0.9);
    }
    c.fillStyle = '#b4834f'; c.fill();
    c.lineWidth = lw * 0.9; c.strokeStyle = 'rgba(52,32,14,0.85)'; c.stroke();
    // claws
    const nx = -uy, ny = ux;
    c.beginPath();
    for (const s of [-1, 1]) {
      c.moveTo(claw[0], claw[1]);
      c.quadraticCurveTo(claw[0] + ux * 1.0 + nx * s * 0.5, claw[1] + uy * 1.0 + ny * s * 0.5, claw[0] + ux * 0.6 + nx * s * 1.3, claw[1] + uy * 0.6 + ny * s * 1.3);
    }
    c.lineWidth = Math.max(0.28, 0.5 * px); c.strokeStyle = INK; c.stroke();
    // bristles along femur, tibia, tarsus
    c.beginPath();
    const hr = rng(300 + k);
    const hairs = (a, b, w, n, len) => {
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, ex = dx / l, ey = dy / l, hx = -ey, hy = ex;
      for (let q = 0; q < n; q++) {
        const s = q % 2 ? 1 : -1, ff = 0.08 + 0.86 * (q + hr() * 0.8) / n;
        const bx = a[0] + dx * ff + hx * s * w * 0.42, by = a[1] + dy * ff + hy * s * w * 0.42;
        const ll = len * (0.6 + hr() * 0.6), sp = 0.28 + hr() * 0.22;
        c.moveTo(bx, by);
        c.lineTo(bx + (ex + hx * s * sp) * ll, by + (ey + hy * s * sp) * ll);
      }
    };
    hairs(c1, knee, 3.6, 7, 1.3);
    hairs(knee, ankle, 2.2, 12, 1.25);
    hairs(ankle, claw, 1.2, 7, 0.75);
    c.lineWidth = Math.max(0.14, 0.3 * px); c.strokeStyle = 'rgba(40,24,10,0.55)'; c.stroke();
    // tibial spurs
    const sx = ankle[0] - knee[0], sy = ankle[1] - knee[1], sl = Math.hypot(sx, sy) || 1;
    c.beginPath();
    c.moveTo(ankle[0] - sx / sl * 0.6, ankle[1] - sy / sl * 0.6);
    c.lineTo(ankle[0] + sx / sl * 1.8 - sy / sl * 1.0, ankle[1] + sy / sl * 1.8 + sx / sl * 1.0);
    c.lineWidth = Math.max(0.35, 0.55 * px); c.strokeStyle = INK; c.stroke();
  }
}

function drawAbdomen(c, F) {
  const [lx, ly] = F.light, px = F.px;
  c.beginPath(); closedSpline(c, ABD);
  const g = c.createRadialGradient(-36 + lx * 10, ly * 10, 2, -38, 0, 26);
  g.addColorStop(0, COL.abd0); g.addColorStop(0.55, COL.abd1); g.addColorStop(1, COL.abd2);
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  // tergites: dark posterior bands, curved, narrowing at the sides
  const xs = [-12.5, -19.5, -27.8, -36.8, -45.8, -54.2, -61.6, -69];
  for (let i = 1; i < 7; i++) {
    const segL = xs[i] - xs[i + 1], th = segL * (i === 6 ? 0.85 : i === 1 ? 0.32 : 0.5);
    c.beginPath();
    const pts = [];
    for (let y = -23; y <= 23; y += 1.5) {
      const q = clamp(Math.abs(y) / 21, 0, 1);
      const xb = xs[i + 1] - 2.3 * (1 - q * q);
      pts.push([xb + th * (1 - 0.55 * q * q), y]);
    }
    for (let y = 23; y >= -23; y -= 1.5) { const q = clamp(Math.abs(y) / 21, 0, 1); pts.push([xs[i + 1] - 2.3 * (1 - q * q) - 0.2, y]); }
    c.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) c.lineTo(p[0], p[1]);
    c.closePath();
    c.fillStyle = i >= 5 ? 'rgba(42,26,14,0.93)' : 'rgba(52,32,16,0.86)'; c.fill();
  }
  // intersegment seams
  c.strokeStyle = 'rgba(255,236,200,0.25)'; c.lineWidth = Math.max(0.35, 0.6 * px);
  c.beginPath();
  for (let i = 1; i < 7; i++) {
    for (let y = -22; y <= 22; y += 2) { const q = Math.abs(y) / 21; const x = xs[i] - 2.3 * (1 - q * q); y === -22 ? c.moveTo(x, y) : c.lineTo(x, y); }
  }
  c.stroke();
  // fine hairs, rows near each tergite margin
  c.beginPath();
  for (let i = 1; i < 7; i++) {
    for (let y = -17; y <= 17; y += 2.6) {
      const q = Math.abs(y) / 21, x = xs[i + 1] - 2.3 * (1 - q * q) + 1.2;
      c.moveTo(x, y); c.lineTo(x - 2.0, y + y * 0.04);
    }
  }
  c.strokeStyle = 'rgba(40,22,8,0.55)'; c.lineWidth = Math.max(0.2, 0.35 * px); c.stroke();
  // roundness: rim shade + soft highlight
  let rg = c.createRadialGradient(-38, 0, 8, -38, 0, 34);
  rg.addColorStop(0, 'rgba(60,34,12,0)'); rg.addColorStop(0.7, 'rgba(60,34,12,0.08)'); rg.addColorStop(1, 'rgba(60,34,12,0.42)');
  c.fillStyle = rg; c.fillRect(-75, -25, 70, 50);
  rg = c.createRadialGradient(-33 + lx * 9, ly * 9, 0, -33 + lx * 9, ly * 9, 12);
  rg.addColorStop(0, 'rgba(255,248,230,0.4)'); rg.addColorStop(1, 'rgba(255,248,230,0)');
  c.fillStyle = rg; c.fillRect(-75, -25, 70, 50);
  c.restore();
  c.beginPath(); closedSpline(c, ABD);
  c.lineWidth = Math.max(0.55, 0.75 * px); c.strokeStyle = INK; c.stroke();
}

function drawHalteres(c, F) {
  const px = F.px;
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(-11.5, s * 12.5); c.lineTo(-15.2, s * 16.6);
    c.lineWidth = 0.9; c.strokeStyle = '#a7804f'; c.stroke();
    c.beginPath(); c.ellipse(-16.2, s * 17.6, 2.2, 1.8, s * 0.7, 0, TAU);
    c.fillStyle = '#efe0b9'; c.fill();
    c.lineWidth = Math.max(0.35, 0.6 * px); c.strokeStyle = 'rgba(52,32,14,0.85)'; c.stroke();
  }
}

function drawOneWing(c, F, side, ang, alpha, detail) {
  const px = F.px;
  c.save();
  c.translate(4.5, side * 11.6);
  c.rotate(Math.PI - side * ang);
  if (side > 0) c.scale(1, -1);
  c.beginPath(); closedSpline(c, WOUT);
  c.fillStyle = `rgba(248,249,244,${0.2 * alpha})`; c.fill();
  const g = c.createLinearGradient(0, -12, WL, 14);
  g.addColorStop(0, 'rgba(255,200,200,0)');
  g.addColorStop(0.32, `rgba(255,196,168,${0.13 * alpha})`);
  g.addColorStop(0.52, `rgba(166,232,196,${0.13 * alpha})`);
  g.addColorStop(0.74, `rgba(170,186,255,${0.13 * alpha})`);
  g.addColorStop(1, 'rgba(210,170,255,0)');
  c.fillStyle = g; c.fill();
  // smoky veil near base
  const g2 = c.createLinearGradient(0, 0, WL * 0.5, 0);
  g2.addColorStop(0, `rgba(120,96,70,${0.12 * alpha})`); g2.addColorStop(1, 'rgba(120,96,70,0)');
  c.fillStyle = g2; c.fill();
  c.lineWidth = Math.max(0.3, 0.55 * px); c.strokeStyle = `rgba(70,52,34,${0.55 * alpha})`; c.stroke();
  // sheen streak, depends on where the light is
  const sh = 0.5 + 0.5 * (F.light[0] * -Math.cos(ang) + F.light[1] * side * Math.sin(ang));
  c.save(); c.clip();
  const g3 = c.createLinearGradient(WL * 0.2, 10, WL * 0.6, -8);
  g3.addColorStop(0, 'rgba(255,255,255,0)'); g3.addColorStop(0.5, `rgba(255,255,255,${(0.1 + 0.25 * sh) * alpha})`); g3.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g3; c.fillRect(0, -25, WL, 40);
  c.restore();
  // veins
  const vein = (pts, w0, w1, a) => {
    // thick proximal half, then the whole vein at the distal width
    c.strokeStyle = `rgba(78,52,28,${a * alpha})`;
    c.beginPath(); openSpline(c, pts); c.lineWidth = Math.max(w1, 0.5 * px); c.stroke();
    if (pts.length > 2 && w0 > w1 + 0.08) {
      c.beginPath(); openSpline(c, pts.slice(0, Math.ceil(pts.length / 2))); c.lineWidth = Math.max(w0, 0.5 * px); c.stroke();
    }
  };
  if (detail) {
    c.lineCap = 'round';
    vein(VEINS.C, 0.75, 0.4, 0.9);
    vein(VEINS.Sc, 0.4, 0.3, 0.45);
    vein(VEINS.L1, 0.55, 0.45, 0.85);
    vein(VEINS.L2, 0.55, 0.32, 0.85);
    vein(VEINS.L3, 0.55, 0.32, 0.85);
    vein(VEINS.L4, 0.55, 0.32, 0.85);
    vein(VEINS.L5, 0.5, 0.3, 0.8);
    vein(VEINS.L6, 0.45, 0.3, 0.45);
    vein(VEINS.acv, 0.42, 0.42, 0.85);
    vein(VEINS.pcv, 0.42, 0.42, 0.85);
    vein(VEINS.hcv, 0.4, 0.4, 0.6);
    vein(VEINS.bcv, 0.35, 0.35, 0.5);
    // marginal fringe of microtrichia on the trailing edge
    if (px < 0.9) {
      c.beginPath();
      for (let i = 11; i < WOUT.length - 1; i++) {
        const a = WOUT[i], b = WOUT[i + 1];
        for (let q = 0; q < 4; q++) {
          const f = q / 4, x = lerp(a[0], b[0], f), y = lerp(a[1], b[1], f);
          const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
          c.moveTo(x, y); c.lineTo(x + dy / l * 1.4 - dx / l * 0.7, y - dx / l * 1.4 - dy / l * 0.7);
        }
      }
      c.lineWidth = 0.14; c.strokeStyle = `rgba(80,60,40,${0.16 * alpha})`; c.stroke();
    }
  } else {
    c.lineCap = 'round';
    for (const k of ['C', 'L2', 'L3', 'L4', 'L5']) {
      c.beginPath(); openSpline(c, VEINS[k]);
      c.lineWidth = 0.45; c.strokeStyle = `rgba(78,52,28,${0.7 * alpha})`; c.stroke();
    }
  }
  c.restore();
}

function drawWings(c, F) {
  const rest = -0.015;
  if (F.buzz > 0.02) {
    // motion-blurred stroke: a fan of faint wing copies over the stroke arc
    const K = 9;
    for (const side of [-1, 1]) {
      for (let q = 0; q < K; q++) {
        const a = rest + 0.35 + (1.15 * F.buzz) * (q / (K - 1));
        drawOneWing(c, F, side, a, 0.17 + 0.05 * (1 - F.buzz), false);
      }
    }
    return;
  }
  const a = rest + 0.55 * sstep(F.spread);
  drawOneWing(c, F, -1, a, 1, true);
  drawOneWing(c, F, 1, a, 1, true);
}

function bristle(c, x, y, ang, len, w) {
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx, b = len * 0.07;
  const tx = x + dx * len + nx * b, ty = y + dy * len + ny * b;

  c.quadraticCurveTo(x + dx * len * 0.55 + nx * (w * 0.3 + b * 0.8), y + dy * len * 0.55 + ny * (w * 0.3 + b * 0.8), tx, ty);

  c.closePath();
}

function drawThorax(c, F) {
  const [lx, ly] = F.light, px = F.px;
  c.beginPath(); closedSpline(c, THX);
  let g = c.createRadialGradient(5 + lx * 9, ly * 9, 1, 4, 0, 22);
  g.addColorStop(0, COL.thx0); g.addColorStop(0.55, COL.thx1); g.addColorStop(1, COL.thx2);
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  // vittae: faint darker stripes
  c.lineCap = 'round';
  c.strokeStyle = 'rgba(110,64,28,0.15)';
  for (const y of [-6.4, 6.4]) { c.lineWidth = 3.6; c.beginPath(); c.moveTo(23, y * 0.75); c.quadraticCurveTo(5, y * 1.06, -13, y * 0.82); c.stroke(); }
  c.lineWidth = 1.8; c.beginPath(); c.moveTo(24, 0); c.lineTo(-13, 0); c.stroke();
  // microchaetae rows
  c.beginPath();
  const mr = rng(77);
  for (const y0 of [1.5, 3.9, 6.4, 8.9, 11.3, 13.5]) {
    for (const s of [-1, 1]) {
      for (let x = 22 - y0 * 0.45 - mr() * 1.5; x > -13; x -= 1.7 + mr() * 1.2) {
        const y = s * (y0 + (mr() - 0.5) * 1.1);
        const l = 0.9 + mr() * 0.6;
        c.moveTo(x, y); c.lineTo(x - l, y + s * (0.15 + mr() * 0.25));
      }
    }
  }
  c.strokeStyle = 'rgba(48,26,8,0.42)'; c.lineWidth = Math.max(0.16, 0.3 * px); c.stroke();
  // humeral calli
  for (const s of [-1, 1]) {
    const hg = c.createRadialGradient(20, s * 11.5, 0, 20, s * 11.5, 5);
    hg.addColorStop(0, 'rgba(250,215,160,0.5)'); hg.addColorStop(1, 'rgba(250,215,160,0)');
    c.fillStyle = hg; c.fillRect(14, s * 11.5 - 6, 12, 12);
  }
  // rim shade and gloss
  g = c.createRadialGradient(4, 0, 6, 4, 0, 22);
  g.addColorStop(0, 'rgba(60,32,10,0)'); g.addColorStop(0.75, 'rgba(60,32,10,0.1)'); g.addColorStop(1, 'rgba(60,32,10,0.45)');
  c.fillStyle = g; c.fillRect(-20, -20, 50, 40);
  g = c.createRadialGradient(8 + lx * 8, ly * 8, 0, 8 + lx * 8, ly * 8, 9);
  g.addColorStop(0, 'rgba(255,250,235,0.55)'); g.addColorStop(1, 'rgba(255,250,235,0)');
  c.fillStyle = g; c.fillRect(-20, -20, 50, 40);
  c.restore();
  c.beginPath(); closedSpline(c, THX);
  c.lineWidth = Math.max(0.55, 0.75 * px); c.strokeStyle = INK; c.stroke();
  // suture line (transverse)
  c.beginPath(); c.moveTo(-1, -16.5); c.quadraticCurveTo(2, -12, 6.5, -9.5);
  c.moveTo(-1, 16.5); c.quadraticCurveTo(2, 12, 6.5, 9.5);
  c.lineWidth = Math.max(0.3, 0.45 * px); c.strokeStyle = 'rgba(60,34,12,0.45)'; c.stroke();
  // scutellum
  c.beginPath(); closedSpline(c, SCU);
  g = c.createRadialGradient(-18 + lx * 4, ly * 4, 0.5, -19, 0, 10);
  g.addColorStop(0, '#dcad6e'); g.addColorStop(0.6, '#b07a42'); g.addColorStop(1, '#7c5028');
  c.fillStyle = g; c.fill();
  c.lineWidth = Math.max(0.5, 0.7 * px); c.strokeStyle = INK; c.stroke();
  // macrochaetae with sockets
  c.beginPath();
  const all = [];
  for (const b of THX_BR.concat(SCU_BR)) { all.push(b); all.push([b[0], -b[1], -b[2], b[3]]); }
  for (const [x, y, a, l] of all) bristle(c, x, y, deg(a), l, Math.max(0.62, 1.0 * px));
  c.fillStyle = INK; c.fill();
  c.beginPath();
  for (const [x, y] of all) { c.moveTo(x + 0.55, y); c.arc(x, y, 0.55, 0, TAU); }
  c.fillStyle = 'rgba(70,40,16,0.55)'; c.fill();
}

function drawProboscis(c, F) {
  const e = F.feed, px = F.px;
  const tip = 38 + 8 * e;
  c.beginPath(); segPath(c, [35, 0], [tip, 0], 3.4, 3.2, 2.8);
  c.fillStyle = '#b98552'; c.fill(); c.lineWidth = Math.max(0.4, 0.6 * px); c.strokeStyle = INK; c.stroke();
  for (const s of [-1, 1]) {
    c.beginPath(); c.ellipse(tip + 2.2, s * 1.7, 2.8 * (0.85 + 0.15 * e), 2.0, s * 0.35, 0, TAU);
    c.fillStyle = '#d8ae80'; c.fill(); c.stroke();
    c.beginPath();
    for (let q = -2; q <= 2; q++) { c.moveTo(tip + 0.8, s * 1.7 + q * 0.2); c.quadraticCurveTo(tip + 2.4, s * (1.7 + q * 0.55), tip + 4.4, s * (1.7 + q * 0.8)); }
    c.lineWidth = Math.max(0.15, 0.3 * px); c.strokeStyle = 'rgba(90,50,20,0.6)'; c.stroke();
  }
}

function drawEye(c, F, s) {
  const px = F.px;
  c.save();
  c.translate(EYE.cx, s * EYE.cy); c.rotate(-s * EYE.rot);
  const l = rotV(F.light, s * EYE.rot);
  c.beginPath(); c.ellipse(0, 0, EYE.rx, EYE.ry, 0, 0, TAU);
  let g = c.createRadialGradient(l[0] * 3.2, l[1] * 3.2, 0.5, 0, 0, 9.5);
  g.addColorStop(0, '#f2654c'); g.addColorStop(0.42, '#c92d1f'); g.addColorStop(0.8, '#8a170f'); g.addColorStop(1, '#4a0805');
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  // facet lattice
  c.lineWidth = Math.max(0.12, 0.32 * px);
  c.strokeStyle = `rgba(55,4,2,${px < 0.6 ? 0.42 : 0.2})`;
  c.stroke(FACETS.p);
  if (px < 0.7) {
    c.beginPath();
    for (const [x, y] of FACETS.glints) { const gx = x + l[0] * 0.18, gy = y + l[1] * 0.18; c.moveTo(gx + 0.17, gy); c.arc(gx, gy, 0.17, 0, TAU); }
    c.fillStyle = 'rgba(255,215,190,0.28)'; c.fill();
  }
  // pseudopupil
  g = c.createRadialGradient(-0.4, 0, 0, -0.4, 0, 2.8);
  g.addColorStop(0, 'rgba(30,0,0,0.55)'); g.addColorStop(1, 'rgba(30,0,0,0)');
  c.fillStyle = g; c.fillRect(-4, -4, 8, 8);
  // limb darkening
  g = c.createRadialGradient(0, 0, 4, 0, 0, 9.2);
  g.addColorStop(0, 'rgba(40,0,0,0)'); g.addColorStop(1, 'rgba(40,0,0,0.5)');
  c.fillStyle = g; c.fillRect(-10, -10, 20, 20);
  // specular
  const hx = l[0] * 4.3, hy = l[1] * 3.5;
  g = c.createRadialGradient(hx, hy, 0, hx, hy, 3.2);
  g.addColorStop(0, 'rgba(255,250,240,0.75)'); g.addColorStop(0.4, 'rgba(255,240,230,0.25)'); g.addColorStop(1, 'rgba(255,240,230,0)');
  c.fillStyle = g; c.fillRect(hx - 4, hy - 4, 8, 8);
  c.beginPath(); c.ellipse(hx * 1.05, hy * 1.05, 1.1, 0.7, Math.atan2(l[1], l[0]) + Math.PI / 2, 0, TAU);
  c.fillStyle = 'rgba(255,255,255,0.85)'; c.fill();
  c.restore();
  c.beginPath(); c.ellipse(0, 0, EYE.rx, EYE.ry, 0, 0, TAU);
  c.lineWidth = Math.max(0.5, 0.7 * px); c.strokeStyle = '#2a0a05'; c.stroke();
  c.restore();
}

function drawAntenna(c, F, s) {
  const px = F.px;
  c.save();
  c.translate(38.4, s * 3.3);
  c.rotate(s * (0.5 + F.ant));
  // pedicel
  c.beginPath(); c.arc(0, 0, 1.9, 0, TAU);
  c.fillStyle = '#b06e35'; c.fill(); c.lineWidth = Math.max(0.35, 0.55 * px); c.strokeStyle = INK; c.stroke();
  // funiculus (third segment)
  c.beginPath(); c.ellipse(3.4, 0, 3.4, 2.2, 0, 0, TAU);
  const g = c.createRadialGradient(2.6, -0.6 * s, 0.2, 3.4, 0, 3.6);
  g.addColorStop(0, '#e2a868'); g.addColorStop(1, '#a4652d');
  c.fillStyle = g; c.fill(); c.stroke();
  // arista: plumose, branches mostly on the dorsal (outer) side
  c.beginPath();
  const ax0 = 2.4, ay0 = s * 1.2;
  const P = u => [ax0 + u * 13, ay0 + s * (u * 2.6 + u * u * 1.4)];
  let p = P(0); c.moveTo(p[0], p[1]);
  for (let u = 0.1; u <= 1.001; u += 0.1) { p = P(u); c.lineTo(p[0], p[1]); }
  c.lineWidth = Math.max(0.3, 0.5 * px); c.strokeStyle = '#3a2412'; c.stroke();
  c.beginPath();
  const br = [[0.28, 1, 3.4], [0.4, 1, 3.6], [0.52, 1, 3.5], [0.64, 1, 3.1], [0.76, 1, 2.6], [0.88, 1, 2.0], [0.36, -1, 2.4], [0.56, -1, 2.3], [0.74, -1, 1.8]];
  for (const [u, side, len] of br) {
    const a = P(u), b = P(u + 0.05), dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
    const ex = dx / l, ey = dy / l, nx = -ey * s * side, ny = ex * s * side;
    c.moveTo(a[0], a[1]); c.lineTo(a[0] + (ex * 0.8 + nx * 0.6) * len, a[1] + (ey * 0.8 + ny * 0.6) * len);
  }
  c.lineWidth = Math.max(0.18, 0.4 * px); c.stroke();
  c.restore();
}

function drawHead(c, F) {
  const [lx, ly] = F.light, px = F.px;
  c.save();
  c.translate(22, 0); c.rotate(F.headYaw); c.translate(-22, 0);
  c.beginPath(); closedSpline(c, HEAD);
  let g = c.createRadialGradient(30 + lx * 5, ly * 5, 1, 30, 0, 18);
  g.addColorStop(0, '#e2a35e'); g.addColorStop(0.6, '#c27f3f'); g.addColorStop(1, '#8c5426');
  c.fillStyle = g; c.fill();
  c.lineWidth = Math.max(0.55, 0.75 * px); c.strokeStyle = INK; c.stroke();
  // frontal vitta: the reddish band down the middle of the frons
  c.beginPath(); c.moveTo(38.6, -3.6); c.quadraticCurveTo(31, -5.4, 24.5, -3.6); c.lineTo(24.5, 3.6); c.quadraticCurveTo(31, 5.4, 38.6, 3.6); c.closePath();
  c.fillStyle = 'rgba(176,74,30,0.45)'; c.fill();
  for (const s of [-1, 1]) drawEye(c, F, s);
  // ocellar triangle and ocelli
  c.beginPath(); c.moveTo(27.6, 0); c.lineTo(23.2, -2.6); c.lineTo(23.2, 2.6); c.closePath();
  c.fillStyle = 'rgba(70,40,18,0.85)'; c.fill();
  for (const [x, y] of [[26.4, 0], [23.9, -1.45], [23.9, 1.45]]) {
    c.beginPath(); c.arc(x, y, 0.75, 0, TAU); c.fillStyle = '#e8b871'; c.fill();
    c.beginPath(); c.arc(x - 0.2, y - 0.2, 0.28, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.9)'; c.fill();
  }
  // head bristles
  c.beginPath();
  for (const [x, y, a, l] of HEAD_BR) { bristle(c, x, y, deg(a), l, Math.max(0.5, 1.0 * px)); bristle(c, x, -y, -deg(a), l, Math.max(0.5, 1.0 * px)); }
  c.fillStyle = INK; c.fill();
  for (const s of [-1, 1]) drawAntenna(c, F, s);
  c.restore();
}

function drawFly(c, F) {
  const front = F.groom > 0.35;
  if (F.shadow) flyShadow(c, F);
  drawLegs(c, F, front ? [4, 5, 2, 3] : [4, 5, 2, 3, 0, 1]);
  drawAbdomen(c, F);
  drawHalteres(c, F);
  drawWings(c, F);
  drawThorax(c, F);
  if (F.feed > 0.01) drawProboscis(c, F);
  drawHead(c, F);
  if (front) drawLegs(c, F, [0, 1]);
}

// ============================================================ apple slice (static, into the paper layer)
const APPLE_OUT = [[0, -100], [3, -70], [-5, -40], [-15, -14], [-16.5, 8], [-8, 38], [1.5, 70], [0, 101],
  [-14, 105], [-38, 100], [-64, 83], [-84, 53], [-95, 16], [-94, -20], [-85, -54], [-65, -82], [-41, -98], [-23, -103], [-13, -97]];
const APPLE_SKIN = [[0, 101], [-14, 105], [-38, 100], [-64, 83], [-84, 53], [-95, 16], [-94, -20], [-85, -54], [-65, -82], [-41, -98], [-23, -103], [-13, -97], [0, -100]];
function drawApple(c) {
  const r = rng(11);
  c.save();
  c.translate(APPLE.x, APPLE.y); c.rotate(APPLE.rot); c.scale(APPLE.s, APPLE.s);
  // soft cast shadow
  for (let i = 0; i < 4; i++) {
    c.beginPath(); closedSpline(c, jitter(APPLE_OUT.map(([x, y]) => [x + 7 + i, y + 9 + i]), r, 2));
    c.fillStyle = 'rgba(96,66,34,0.05)'; c.fill();
  }
  // flesh washes
  for (let i = 0; i < 3; i++) {
    c.beginPath(); closedSpline(c, jitter(APPLE_OUT, r, 1.6));
    c.fillStyle = 'rgba(246,230,178,0.55)'; c.fill();
  }
  c.save();
  c.beginPath(); closedSpline(c, APPLE_OUT); c.clip();
  // greener near the skin, warmer in the core
  c.lineJoin = 'round';
  for (const [w, col] of [[44, 'rgba(214,206,120,0.16)'], [26, 'rgba(206,196,104,0.2)'], [12, 'rgba(198,168,80,0.22)']]) {
    c.beginPath(); openSpline(c, APPLE_SKIN); c.lineWidth = w; c.strokeStyle = col; c.stroke();
  }
  const cg = c.createRadialGradient(-12, -2, 2, -12, -2, 46);
  cg.addColorStop(0, 'rgba(226,196,124,0.42)'); cg.addColorStop(1, 'rgba(226,196,124,0)');
  c.fillStyle = cg; c.fillRect(-100, -110, 110, 220);
  // skin band with streaks
  c.beginPath(); openSpline(c, APPLE_SKIN); c.lineWidth = 12; c.strokeStyle = 'rgba(176,44,34,0.88)'; c.stroke();
  c.beginPath(); openSpline(c, APPLE_SKIN); c.lineWidth = 7; c.strokeStyle = 'rgba(140,26,24,0.5)'; c.stroke();
  for (let i = 0; i < 70; i++) {
    const k = Math.floor(r() * (APPLE_SKIN.length - 1)), f = r();
    const a = APPLE_SKIN[k], b = APPLE_SKIN[k + 1];
    const x = lerp(a[0], b[0], f), y = lerp(a[1], b[1], f);
    c.beginPath(); c.arc(x * 0.985, y * 0.985, 0.6 + r() * 0.7, 0, TAU);
    c.fillStyle = r() < 0.5 ? 'rgba(232,190,90,0.7)' : 'rgba(110,18,16,0.5)'; c.fill();
  }
  c.restore();
  // vascular line of the core
  c.save();
  c.setLineDash([2.5, 3.5]);
  c.beginPath(); openSpline(c, [[-2, -78], [-30, -66], [-50, -36], [-56, 0], [-48, 36], [-28, 66], [-2, 80]]);
  c.lineWidth = 0.9; c.strokeStyle = 'rgba(150,120,60,0.55)'; c.stroke();
  c.restore();
  // seed pocket with a seed
  c.beginPath(); c.ellipse(-20, -4, 9, 21, 0.05, 0, TAU);
  c.fillStyle = 'rgba(222,196,130,0.6)'; c.fill();
  c.lineWidth = 0.9; c.strokeStyle = 'rgba(120,88,40,0.7)'; c.stroke();
  c.beginPath(); c.moveTo(-21, -15); c.quadraticCurveTo(-27, -2, -21, 10); c.quadraticCurveTo(-15, -2, -21, -15);
  const sg = c.createLinearGradient(-26, -12, -16, 8);
  sg.addColorStop(0, '#7a4524'); sg.addColorStop(1, '#3e2010');
  c.fillStyle = sg; c.fill(); c.lineWidth = 0.8; c.strokeStyle = INK; c.stroke();
  c.beginPath(); c.moveTo(-22.5, -9); c.quadraticCurveTo(-24, -3, -22.6, 2); c.lineWidth = 0.9; c.strokeStyle = 'rgba(255,230,200,0.6)'; c.stroke();
  // stipple, denser toward the skin and the core
  c.beginPath();
  for (let i = 0; i < 1100; i++) {
    const x = -96 + r() * 100, y = -104 + r() * 210;
    if (!inPoly(APPLE_OUT, x, y)) continue;
    const dCore = Math.hypot((x + 20) / 1.2, (y + 4) / 2.2), edge = Math.abs(Math.hypot(x / 95, y / 104) - 1);
    const p = 0.12 + 0.9 * Math.exp(-edge * 10) + 0.5 * Math.exp(-dCore / 12);
    if (r() > p) continue;
    c.moveTo(x + 0.55, y); c.arc(x, y, 0.45 + r() * 0.35, 0, TAU);
  }
  c.fillStyle = 'rgba(96,64,30,0.55)'; c.fill();
  // wet glints
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(-58, -30); c.quadraticCurveTo(-62, -8, -58, 12);
  c.moveTo(-40, 42); c.quadraticCurveTo(-44, 52, -50, 58);
  c.lineWidth = 2.2; c.strokeStyle = 'rgba(255,253,240,0.75)'; c.stroke();
  // ink outline, drawn twice for a hand-inked feel
  c.beginPath(); closedSpline(c, APPLE_OUT); c.lineWidth = 1.25; c.strokeStyle = INK; c.stroke();
  c.beginPath(); closedSpline(c, jitter(APPLE_OUT, r, 0.9)); c.lineWidth = 0.6; c.strokeStyle = 'rgba(36,24,13,0.45)'; c.stroke();
  // stem nub
  c.beginPath(); c.moveTo(-9, -99); c.quadraticCurveTo(-6, -110, 2, -116);
  c.lineWidth = 3; c.strokeStyle = '#5a3a1c'; c.stroke();
  c.lineWidth = 0.8; c.strokeStyle = INK; c.stroke();
  c.restore();
}

// ============================================================ spider (live, mostly still)
const SPL = [ // attach, base angle (deg from forward, outward), segment lengths, bends, widths
  { a: [34, 17], ang: 38, len: [5, 30, 11, 24, 18, 11], bend: [0, 12, -30, -8, -6, -4], w: [7.4, 7, 6.4, 5.2, 3.6, 2.4] },
  { a: [24, 21], ang: 72, len: [5, 26, 10, 20, 16, 10], bend: [0, 8, -24, -6, -4, -3], w: [5.6, 5.2, 4.8, 4, 2.9, 2] },
  { a: [11, 22], ang: 108, len: [5, 25, 10, 20, 18, 10], bend: [0, -6, 22, 8, 6, 4], w: [5.6, 5.2, 4.8, 4, 2.9, 2] },
  { a: [-1, 19], ang: 146, len: [5, 30, 11, 24, 22, 11], bend: [0, -8, 22, 10, 6, 4], w: [5.8, 5.4, 5, 4.2, 3, 2] },
];
const SP_CARA = mirror([[46, 0], [44.5, -12], [39, -20.5], [27, -24], [11, -23.5], [0, -19.5], [-6, -10.5], [-7.5, 0]]);
const SP_ABD = mirror([[-6, 0], [-9, -13], [-19, -23.5], [-35, -28], [-52, -26.5], [-66, -19], [-75, -9], [-77, 0]]);

function drawSpider(c, t) {
  const r = rng(5);
  const alert = sstep(win(t, TL.stop - 0.6, TL.back0 + 1.2, 0.5, 0.8));
  c.save();
  c.translate(SPIDER.x, SPIDER.y); c.rotate(SPIDER.h); c.scale(SPIDER.s, SPIDER.s);
  // shadow
  c.save(); c.translate(-12 + 5, 6); c.scale(1, 0.55);
  const sg = c.createRadialGradient(0, 0, 0, 0, 0, 66);
  sg.addColorStop(0, 'rgba(66,44,22,0.3)'); sg.addColorStop(1, 'rgba(66,44,22,0)');
  c.fillStyle = sg; c.beginPath(); c.arc(0, 0, 66, 0, TAU); c.fill();
  c.restore();
  // legs
  for (const s of [-1, 1]) {
    SPL.forEach((L, li) => {
      let ang = deg(L.ang);
      const pts = [[L.a[0], s * L.a[1]]];
      let x = L.a[0], y = s * L.a[1];
      const tw = 0.03 * Math.sin(TAU * (0.35 + li * 0.13) * t + li + (s > 0 ? 1 : 0));
      for (let q = 0; q < L.len.length; q++) {
        ang += deg(L.bend[q]) + tw * (q > 1 ? 1 : 0);
        let len = L.len[q];
        if (li === 0) { // front legs lift and reach a little when the fly is near
          if (q === 1) { ang -= deg(8) * alert; len *= 1 - 0.14 * alert; }
          if (q >= 3) ang -= deg(4) * alert * Math.sin(TAU * 1.3 * t) * 0.5;
        }
        x += Math.cos(ang) * len; y += s * Math.sin(ang) * len;
        pts.push([x, y]);
      }
      // leg shadow
      c.beginPath(); c.moveTo(pts[0][0] + 4, pts[0][1] + 5);
      for (let q = 1; q < pts.length; q++) { const hgt = q < 3 ? 1 : q < 5 ? 0.6 : 0.15; c.lineTo(pts[q][0] + 5 * hgt, pts[q][1] + 6 * hgt); }
      c.lineWidth = 3; c.strokeStyle = 'rgba(66,44,22,0.12)'; c.lineCap = 'round'; c.stroke();
      // segments
      c.beginPath();
      for (let q = 0; q < pts.length - 1; q++) {
        const w0 = L.w[q], w1 = L.w[Math.min(q + 1, L.w.length - 1)];
        segPath(c, pts[q], pts[q + 1], w0, (w0 + w1) / 2 + 0.6, w1);
      }
      c.fillStyle = li === 0 ? '#3a2d24' : '#4a3a2e'; c.fill();
      c.lineWidth = 0.7; c.strokeStyle = '#120c07'; c.stroke();
      // pale rings at joints (banding)
      c.beginPath();
      for (let q = 2; q < pts.length - 1; q++) {
        const a = pts[q], b = pts[q + 1], f = 0.18;
        segPath(c, a, [lerp(a[0], b[0], f), lerp(a[1], b[1], f)], L.w[q] * 0.95, L.w[q] * 0.95, L.w[q] * 0.9);
      }
      c.fillStyle = 'rgba(214,190,150,0.75)'; c.fill();
      // hairs and spines
      c.beginPath();
      for (let q = 1; q < pts.length - 1; q++) {
        const a = pts[q], b = pts[q + 1], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy), ex = dx / l, ey = dy / l;
        const n = Math.round(l / 2.2);
        for (let h = 0; h < n; h++) {
          const f = (h + r()) / n, side = h % 2 ? 1 : -1, w = L.w[q] / 2;
          const bx = a[0] + dx * f - ey * side * w, by = a[1] + dy * f + ex * side * w, hl = 2 + r() * 2.4;

const PLUMES = [
  { x: 430, y: 642, col: [204, 120, 64], n: Math.round(LOOP / 1.7), speed: 92, max: 430, wind: [0.16, -0.04], seed: 3, aura: 0.12 },
  { x: 1050, y: 318, col: [84, 92, 150], n: Math.round(LOOP / 1.9), speed: 84, max: 400, wind: [-0.18, 0.12], seed: 9, aura: 0.05 },
];
function drawPlumes(c, t) {
  c.save();
  c.globalCompositeOperation = 'multiply';
  for (const s of PLUMES) {
    const period = LOOP / s.n, ph = mod(t, period), base = Math.floor(mod(t, LOOP) / period);
    const [cr, cg, cb] = s.col;
    // soft aura at the source
    const ag = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, 120);
    ag.addColorStop(0, `rgba(${cr},${cg},${cb},${s.aura})`); ag.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    c.fillStyle = ag; c.fillRect(s.x - 120, s.y - 120, 240, 240);
    for (let k = 0; ; k++) {
      const age = ph + k * period, R = 24 + age * s.speed;
      if (R > s.max) break;
      const id = mod(base - k, s.n), sd = s.seed + id * 1.7;
      const a = 0.26 * Math.pow(1 - R / s.max, 1.25) * sstep((R - 24) / 40);
      const cx = s.x + s.wind[0] * R, cy = s.y + s.wind[1] * R;
      const w = 10 + R * 0.07;
      const ring = (rr) => {
        for (let q = 0; q <= 90; q++) {
          const th = q / 90 * TAU;
          const m = 1 + 0.055 * Math.sin(3 * th + sd) + 0.03 * Math.sin(5 * th + 2.3 * sd) + 0.018 * Math.sin(11 * th + sd * 3.1);
          const x = cx + Math.cos(th) * rr * m, y = cy + Math.sin(th) * rr * m;
          q ? c.lineTo(x, y) : c.moveTo(x, y);
        }
        c.closePath();
      };
      c.beginPath(); ring(R); ring(Math.max(1, R - w));
      c.fillStyle = `rgba(${cr},${cg},${cb},${a * 0.55})`; c.fill('evenodd');
      c.beginPath(); ring(R);
      c.lineWidth = 1.6; c.strokeStyle = `rgba(${cr - 30},${cg - 30},${cb - 20},${a * 1.1})`; c.stroke();
      c.beginPath(); ring(R - w);
      c.lineWidth = 0.7; c.strokeStyle = `rgba(${cr},${cg},${cb},${a * 0.6})`; c.stroke();
    }
  }
  c.restore();
}

}

function writeText(c, txt, x, y, prog, col) {
  if (prog <= 0) return;
  const w = c.measureText(txt).width;
  c.save();
  c.beginPath(); c.rect(x - 6, y - 40, (w + 12) * sstep(prog) + 0.01, 60); c.clip();
  c.fillStyle = col; c.fillText(txt, x, y);
  c.restore();
  if (prog < 1) {
    c.beginPath(); c.arc(x + w * sstep(prog), y - 7 + 3 * Math.sin(prog * 70), 1.5, 0, TAU);
    c.fillStyle = col; c.fill();
  }
}
function strokeCurve(c, pts, prog) {
  // pts: cubic bezier control points; draws the first `prog` of it
  const n = 40, m = Math.floor(n * clamp(prog, 0, 1));
  const B = u => { const a = (1 - u) ** 3, b = 3 * (1 - u) ** 2 * u, cc = 3 * (1 - u) * u * u, e = u ** 3; return [a * pts[0][0] + b * pts[1][0] + cc * pts[2][0] + e * pts[3][0], a * pts[0][1] + b * pts[1][1] + cc * pts[2][1] + e * pts[3][1]]; };
  c.beginPath();
  for (let i = 0; i <= m; i++) { const p = B(i / n); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
  c.stroke();
  return B(m / n);
}

function drawAnnotations(c, t, st) {
  const t0 = TL.stop;
  if (t < t0) return;
  const fade = 1 - sstep((t - (TL.back0 + 2.2)) / 0.8);
  if (fade <= 0) return;
  const head = flyHead(st);
  c.save(); c.globalAlpha = fade;
  c.lineCap = 'round';
  // 1) asking
  c.font = '500 31px Caveat, cursive'; c.textAlign = 'left';
  const t1 = 'Unfamiliar smell. Asking the fleet...';
  const w1 = c.measureText(t1).width, x1 = 820 - w1, y1 = 318;
  const lf = 1 - sstep((t - TL.back1) / 0.5);   // leaders let go once the fly walks off
  c.globalAlpha = fade * lf;
  c.lineWidth = 0.9; c.strokeStyle = 'rgba(58,40,24,0.8)';
  const e1 = strokeCurve(c, [[826, y1 - 9], [870, y1 - 6], [head[0] - 30, head[1] - 60], [head[0] - 6, head[1] - 10]], (t - t0 - 0.1) / 0.35);
  if (t - t0 > 0.45) { c.beginPath(); c.arc(e1[0], e1[1], 1.8, 0, TAU); c.fillStyle = SEPIA; c.fill(); }
  c.globalAlpha = fade;
  writeText(c, t1, x1, y1, (t - t0 - 0.35) / 0.95, SEPIA);
  // 2) the answer
  const ta = t0 + 2.3;
  if (t > ta) {
    c.font = '600 31px Caveat, cursive';
    const l1 = '3 flies were hurt by something', l2 = 'that smells like this (0.83 match)';
    const w2 = Math.max(c.measureText(l1).width, c.measureText(l2).width), x2 = 820 - w2;
    c.globalAlpha = fade * lf;
    c.lineWidth = 1.0; c.strokeStyle = 'rgba(155,42,31,0.85)';
    const e2 = strokeCurve(c, [[826, 380], [880, 390], [head[0] - 40, head[1] - 20], [head[0] - 8, head[1] - 4]], (t - ta) / 0.35);
    if (t - ta > 0.35) { c.beginPath(); c.arc(e2[0], e2[1], 1.9, 0, TAU); c.fillStyle = RED; c.fill(); }
    c.globalAlpha = fade;
    writeText(c, l1, x2, 366, (t - ta - 0.25) / 0.55, RED);
    writeText(c, l2, x2, 400, (t - ta - 0.75) / 0.6, RED);
  }
  c.restore();
}

function drawCardLive(c, t, st) {
  const t0 = TL.stop;
  const fadeAll = 1 - sstep((t - (LOOP - 1.5)) / 1.0);
  if (t < t0 || fadeAll <= 0) return;
  const head = flyHead(st);
  const qY = ROW0 + ENTRIES.length * ROWH + 10;
  // thread from the fly to the card
  const thFade = 1 - sstep((t - TL.back1) / 0.5);
  const qWorld = cardToWorld(36, qY - 8);
  c.save(); c.lineCap = 'round';
  if (thFade > 0) {
    c.globalAlpha = thFade;
    c.setLineDash([3, 5]); c.lineWidth = 1.0; c.strokeStyle = 'rgba(58,40,24,0.75)';
    const P = [[head[0] + 8, head[1] + 10], [head[0] + 90, head[1] + 190], [qWorld[0] - 200, qWorld[1] + 30], qWorld];
    const pOut = (t - t0 - 0.7) / 0.5;
    const e = strokeCurve(c, P, pOut);
    c.setLineDash([]);
    if (pOut > 0 && pOut < 1.1) { c.beginPath(); c.arc(e[0], e[1], 3, 0, TAU); c.fillStyle = SEPIA; c.fill(); }
    // reply, in red, travelling back
    const pBack = (t - t0 - 2.15) / 0.45;
    if (pBack > 0) {
      const R = [P[3], P[2], P[1], P[0]].map(([x, y]) => [x + 5, y + 6]);
      c.setLineDash([2, 4]); c.strokeStyle = 'rgba(155,42,31,0.85)'; c.lineWidth = 1.1;
      const e2 = strokeCurve(c, R, pBack);
      c.setLineDash([]);
      if (pBack < 1.05) { c.beginPath(); c.arc(e2[0], e2[1], 3, 0, TAU); c.fillStyle = RED; c.fill(); }
    }
  }
  c.restore();
  // writing on the card
  c.save(); c.globalAlpha = fadeAll; cardT(c);
  c.font = '600 22px Caveat, cursive'; c.textAlign = 'left';
  writeText(c, 'fly 27 asks:', 42, qY, (t - t0 - 1.05) / 0.45, INK);
  if (t - t0 > 1.45) glyph(c, 136, qY + 1, QUERY_V, clamp((t - t0 - 1.45) / 0.3, 0, 1), 'rgba(36,24,13,0.9)');
  writeText(c, 'like this?', 184, qY, (t - t0 - 1.7) / 0.3, INK);
  // red pencil rings around the three nearest memories, with their scores
  let j = 0;
  ENTRIES.forEach((e, i) => {
    if (!e.bad) return;
    const ts = t0 + 1.9 + j * 0.16; j++;
    const p = clamp((t - ts) / 0.3, 0, 1);
    if (p <= 0) return;
    const y = ROW0 + i * ROWH - 7, cx = 136, rx = 102, ry = 14;
    c.beginPath();
    const r = rng(40 + i);
    const a0 = -2.6 + r() * 0.3, span = TAU * 1.06 * p;
    for (let q = 0; q <= 50; q++) {
      const a = a0 + span * q / 50, wob = 1 + 0.04 * Math.sin(a * 3 + i);
      const x = cx + Math.cos(a) * rx * wob, yy = y + Math.sin(a) * ry * wob * (1 + 0.08 * q / 50);
      q ? c.lineTo(x, yy) : c.moveTo(x, yy);
    }
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(165,40,30,0.8)'; c.stroke();
    c.font = '600 19px Caveat, cursive';
    writeText(c, e.s, 246, y + 6, (t - ts - 0.2) / 0.25, RED);
  });
  c.restore();
}

function drawLoupe(c, t, st) {
  const L = LOUPE;
  c.save();
  c.beginPath(); c.arc(L.x, L.y, L.r - 1, 0, TAU); c.clip();
  // faint dotted graticule
  c.strokeStyle = 'rgba(90,70,50,0.12)'; c.lineWidth = 0.6;
  c.beginPath();
  for (let g = -L.r; g <= L.r; g += 30) { c.moveTo(L.x + g, L.y - L.r); c.lineTo(L.x + g, L.y + L.r); c.moveTo(L.x - L.r, L.y + g); c.lineTo(L.x + L.r, L.y + g); }
  c.stroke();
  const H = -Math.PI / 2;
  c.translate(L.x, L.y); c.rotate(H); c.scale(L.k, L.k); c.translate(14, 0);
  const sh = rotV([SHADOW[0] / L.k * 1.4, SHADOW[1] / L.k * 1.4], -H);
  const k = 1 + st.bob * 0.3 + st.spread * 0.4;
  drawFly(c, { ...st, headYaw: st.headYaw * 0.6, px: 1 / (S * L.k), light: rotV(LIGHT, -H), shOff: [sh[0] * k, sh[1] * k], shadow: true });
  c.restore();
  // ring
  c.beginPath(); c.arc(L.x, L.y, L.r, 0, TAU); c.lineWidth = 1.4; c.strokeStyle = 'rgba(36,24,13,0.85)'; c.stroke();
  c.beginPath(); c.arc(L.x, L.y, L.r + 5, 0, TAU); c.lineWidth = 0.6; c.strokeStyle = 'rgba(36,24,13,0.5)'; c.stroke();
  // key letters on the specimen (fixed body points)
  const toL = (bx, by) => { const x = (bx + 14) * L.k, y = by * L.k; return [L.x + y, L.y - x]; };   // rotate -90deg
  c.font = 'italic 600 16px "Cormorant Garamond", Georgia, serif'; c.fillStyle = INK; c.textAlign = 'center';
  c.lineWidth = 0.6; c.strokeStyle = 'rgba(36,24,13,0.6)';
  const keys = [['a', [48.5, -9.6], [-40, -6]], ['b', [31, -16.5], [-36, -6]], ['c', [-28, -3.6], [-74, -14]], ['d', [-58, -14.3], [-40, 14]], ['e', null, [26, -10]]];
  for (const [ch, bp, off] of keys) {
    let p;
    if (bp) p = toL(bp[0], bp[1]);
    else { const lg = st.legs[3]; p = toL(lg.x, lg.y); }
    const q = [p[0] + off[0], p[1] + off[1]];
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0] - Math.sign(off[0]) * 5, q[1] - Math.sign(off[1]) * 4); c.stroke();
    c.fillText(ch, q[0], q[1] + (off[1] < 0 ? -2 : 10));
  }
  // scale bar: body length 2.5 mm ~ 108 fly units
  const mm = 108 / 2.5 * L.k * 0.5;
  const bx = L.x + L.r - 40 - mm, by = L.y + L.r - 14;
  c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + mm, by); c.moveTo(bx, by - 3); c.lineTo(bx, by + 3); c.moveTo(bx + mm, by - 3); c.lineTo(bx + mm, by + 3);
  c.lineWidth = 1; c.strokeStyle = INK; c.stroke();
  c.font = 'italic 400 13px "Cormorant Garamond", Georgia, serif'; c.textAlign = 'center';
  c.fillText('0.5 mm', bx + mm / 2, by - 6);
  c.textAlign = 'left';
}

function drawFootfall(c, t) {
  const x0 = 470, y0 = 896, w = 330, rh = 6.2, gap = 3.2, span = 2.5;
  c.save();
  c.font = '600 14px "Cormorant Garamond", Georgia, serif'; c.fillStyle = INK; c.textAlign = 'left';
  c.fillText('Fig. 5', x0 - 52, y0 - 12);
  c.font = 'italic 400 15px "Cormorant Garamond", Georgia, serif'; c.fillStyle = SEPIA;
  c.fillText('Footfalls, last 2.5 s. Ink means the foot is down: two tripods take turns.', x0, y0 - 12);
  const order = [0, 2, 4, 1, 3, 5];
  const step = 2;
  order.forEach((k, row) => {
    const y = y0 + row * (rh + gap);
    c.font = 'italic 400 12px "Cormorant Garamond", Georgia, serif'; c.fillStyle = SEPIA; c.textAlign = 'right';
    c.fillText(LEGDEF[k].name, x0 - 6, y + rh - 0.5);
    c.fillStyle = LEGDEF[k].tri === 0 ? 'rgba(48,30,14,0.85)' : 'rgba(155,48,30,0.8)';
    let runStart = null;
    const n = Math.round(span / DT / step);
    for (let q = 0; q <= n; q++) {
      const tt = t - span + q * step * DT;
      const i = Math.floor(mod(tt, LOOP) / DT) % NS;
      const down = recF[i * 18 + k * 3 + 2] === 0 && !(k < 2 && groomW(tt) > 0.3);
      const x = x0 + q / n * w;
      if (down && runStart === null) runStart = x;
      if ((!down || q === n) && runStart !== null) { c.fillRect(runStart, y, x - runStart, rh); runStart = null; }
    }
  });
  c.strokeStyle = 'rgba(36,24,13,0.5)'; c.lineWidth = 0.6;
  c.strokeRect(x0, y0 - 1, w, 6 * (rh + gap) - gap + 2);
  c.restore();
}

// ============================================================ frame loop
function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  worldT(ctx);
  const st = flyState(t);
  if (window.__inspect) {   // debug: magnify around the fly (or a given point)
    const I = window.__inspect, k = DPR * S * I.k, cx = I.x ?? st.X, cy = I.y ?? st.Y;
    ctx.fillStyle = PAPER; ctx.fillRect(-1e4, -1e4, 3e4, 3e4);
    ctx.setTransform(k, 0, 0, k, DPR * VW / 2 - k * cx, DPR * VH / 2 - k * cy);
  }
  const P = window.__prof;
  const run = (name, fn) => { if (!P) return fn(); const a = performance.now(); fn(); P[name] = (P[name] || 0) + performance.now() - a; };
  run('plumes', () => drawPlumes(ctx, t));
  run('spider', () => drawSpider(ctx, t));
  run('prints', () => drawPrints(ctx, t));
  run('fly', () => drawFlyWorld(ctx, st, t));
  run('label', () => drawFlyLabel(ctx, t, st));
  run('annot', () => drawAnnotations(ctx, t, st));
  run('card', () => drawCardLive(ctx, t, st));
  run('loupe', () => drawLoupe(ctx, t, st));
  run('foot', () => drawFootfall(ctx, t));
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  S = Math.min(VW / W0, VH / H0); OX = (VW - W0 * S) / 2; OY = (VH - H0 * S) / 2;
  bg.width = cv.width; bg.height = cv.height;
  buildBg();
}
window.addEventListener('resize', () => { resize(); frame(tNow); });

let tNow = 0, paused = false, last = performance.now();
const qs = new URLSearchParams(location.search);
if (qs.has('t')) { tNow = mod(parseFloat(qs.get('t')) || 0, LOOP); paused = true; }
resize();
if (document.fonts) {
  Promise.all([
    document.fonts.load('italic 500 56px "Cormorant Garamond"'), document.fonts.load('400 20px "Cormorant Garamond"'),
    document.fonts.load('600 15px "Cormorant Garamond"'), document.fonts.load('italic 400 17px "Cormorant Garamond"'),
    document.fonts.load('600 30px Caveat'), document.fonts.load('500 21px Caveat'),
  ]).catch(() => {}).then(() => { buildBg(); frame(tNow); });
}
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) tNow = mod(tNow + dt, LOOP);
  frame(tNow);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; e.preventDefault(); } });

// test hooks
window.seek = t => { paused = true; tNow = mod(t, LOOP); frame(tNow); return tNow; };
window.play = () => { paused = false; };
window.__plate = { LOOP, TL, prints, flyState, LEGDEF, legPts, recF, NS, DT };
})();
</script>
