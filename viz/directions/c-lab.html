<script>
(() => {
"use strict";
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
function h2(a, b) {
  let x = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ============================================================
   WORLD (units: mm, arena centre = origin, y down)
   ============================================================ */
const DISH_R = 5.2;          // inner wall radius
const VIEW_R = 6.0;         // half-width of the camera field
const PLAYBACK = 0.5;        // display runs at half speed of the rig clock
const SRC_A = { x: -2.6, y: -2.4 };   // apple purée droplet
const SRC_B = { x: 3.4, y: 0.6 };     // odour port (spider cue)

/* ---------- scripted behaviour ---------- */
const SEGS = [
  { k: "pause", d: 0.35, b: "idle" },
  { k: "turn", d: 0.7 },
  { k: "walk", pts: [[0.4, 3.6], [-0.6, 3.2], [-1.5, 2.1]], v: 3.1 },
  { k: "pause", d: 0.4, b: "idle" },
  { k: "turn", d: 0.3 },
  { k: "walk", pts: [[-1.5, 2.1], [-1.9, 1.2], [-2.1, 0.25]], v: 2.5, rd: 0.55 },
  { k: "pause", d: 1.8, b: "sniff", ev: "A" },
  { k: "turn", d: 0.35 },
  { k: "walk", pts: [[-2.1, 0.25], [-2.3, -0.45], [-2.47, -1.15]], v: 2.1, rd: 0.5, label: "APPROACH" },
  { k: "pause", d: 1.95, b: "feed" },
  { k: "turn", d: 0.6 },
  { k: "walk", pts: [[-2.47, -1.15], [-1.3, -2.0], [-0.2, -1.75], [0.2, -1.3]], v: 3.3 },
  { k: "pause", d: 0.4, b: "idle" },
  { k: "turn", d: 0.25 },
  { k: "walk", pts: [[0.2, -1.3], [0.75, -0.75], [1.25, -0.15]], v: 2.5, rd: 0.5 },
  { k: "pause", d: 1.45, b: "sniff", ev: "B" },
  { k: "startle", d: 0.42 },
  { k: "turn", d: 0.36, dir: 1, label: "AVOID" },
  { k: "walk", pts: [[1.0, -0.42], [-0.2, -0.5], [-1.15, 0.55], [-1.4, 2.1]], v: 6.0, ru: 0.12, rd: 0.45, label: "AVOID" },
  { k: "pause", d: 2.95, b: "groom" },
  { k: "turn", d: 0.4 },
  { k: "walk", pts: [[-1.4, 2.1], [-0.7, 3.2], [0.4, 3.6]], v: 2.9 },
  { k: "pause", d: 0.38, b: "idle", last: true },
];

function buildPath(pts) {
  const n = pts.length, tan = [];
  for (let i = 0; i < n; i++) {
    let tx, ty;
    if (i === 0) { tx = pts[1][0] - pts[0][0]; ty = pts[1][1] - pts[0][1]; }
    else if (i === n - 1) { tx = pts[i][0] - pts[i - 1][0]; ty = pts[i][1] - pts[i - 1][1]; }
    else { tx = (pts[i + 1][0] - pts[i - 1][0]) / 2; ty = (pts[i + 1][1] - pts[i - 1][1]) / 2; }
    tan.push([tx, ty]);
  }
  const P = [];
  for (let i = 0; i < n - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], [m0x, m0y] = tan[i], [m1x, m1y] = tan[i + 1];
    for (let k = i ? 1 : 0; k <= 80; k++) {
      const s = k / 80, s2 = s * s, s3 = s2 * s;
      const a = 2 * s3 - 3 * s2 + 1, b = s3 - 2 * s2 + s, c = -2 * s3 + 3 * s2, d = s3 - s2;
      P.push([a * x0 + b * m0x + c * x1 + d * m1x, a * y0 + b * m0y + c * y1 + d * m1y]);
    }
  }
  const cum = [0];
  for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const ang = P.map((p, i) => {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    return Math.atan2(b[1] - a[1], b[0] - a[0]);
  });
  return { P, cum, ang, L: cum[cum.length - 1] };
}
function pathAt(pa, d) {
  d = clamp(d, 0, pa.L);
  let lo = 0, hi = pa.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pa.cum[m] <= d) lo = m; else hi = m; }
  const f = (d - pa.cum[lo]) / ((pa.cum[hi] - pa.cum[lo]) || 1);
  return { x: lerp(pa.P[lo][0], pa.P[hi][0], f), y: lerp(pa.P[lo][1], pa.P[hi][1], f), a: pa.ang[lo] + wrap(pa.ang[hi] - pa.ang[lo]) * f };
}
function profile(L, v, ru, rd) {
  if (L <= v * (ru + rd) / 2) v = L / ((ru + rd) / 2);
  const tc = (L - v * (ru + rd) / 2) / v;
  const S = x => x * x * x - x * x * x * x / 2;
  return {
    dur: ru + tc + rd,
    s: t => {
      if (t <= 0) return 0;
      if (t < ru) return v * ru * S(t / ru);
      if (t < ru + tc) return v * ru / 2 + v * (t - ru);
      const x = Math.min(1, (t - ru - tc) / rd);
      return v * ru / 2 + v * tc + v * rd * (x - S(x));
    }
  };
}

const plan = [];
let T = 0;
(function build() {
  const lastWalk = [...SEGS].reverse().find(s => s.k === "walk");
  const lp = buildPath(lastWalk.pts);
  let a = lp.ang[lp.ang.length - 1];
  let x = lastWalk.pts[lastWalk.pts.length - 1][0], y = lastWalk.pts[lastWalk.pts.length - 1][1];
  let t = 0;
  SEGS.forEach((s, i) => {
    const seg = Object.assign({}, s, { t0: t, x0: x, y0: y, a0: a, i });
    if (s.k === "pause") {
      seg.dur = s.d; seg.f = () => ({ x: seg.x0, y: seg.y0, a: seg.a0 });
    } else if (s.k === "turn") {
      const nw = SEGS.slice(i + 1).find(q => q.k === "walk");
      const target = buildPath([[x, y], ...nw.pts.slice(1)]).ang[0];
      let d = wrap(target - a);
      if (s.dir > 0 && d < 0) d += TAU;
      if (s.dir < 0 && d > 0) d -= TAU;
      seg.dur = s.d; seg.delta = d;
      seg.f = tau => ({ x: seg.x0, y: seg.y0, a: seg.a0 + d * sstep(tau / s.d) });
      a += d;
    } else if (s.k === "walk") {
      const pa = buildPath([[x, y], ...s.pts.slice(1)]);
      const pr = profile(pa.L, s.v, s.ru || 0.35, s.rd || 0.42);
      seg.dur = pr.dur; seg.f = tau => pathAt(pa, pr.s(tau));
      const e = pathAt(pa, pa.L); x = e.x; y = e.y; a = e.a;
    } else if (s.k === "startle") {
      const dx = Math.cos(a), dy = Math.sin(a);
      seg.dur = s.d;
      seg.f = tau => {
        const back = 0.42 * (1 - Math.pow(1 - clamp(tau / 0.18, 0, 1), 3));
        const j = 1 - tau / s.d;
        const lat = 0.035 * Math.sin(tau * 95) * j * sstep(tau / 0.04);
        return { x: seg.x0 - dx * back - dy * lat, y: seg.y0 - dy * back + dx * lat, a: seg.a0 + 0.06 * Math.sin(tau * 73) * j };
      };
      x -= dx * 0.42; y -= dy * 0.42;
    }
    t += seg.dur;
    plan.push(seg);
  });
  T = t;
})();

const N = Math.round(T / (1 / 240));
const DT = T / N;
const X = new Float64Array(N + 1), Y = new Float64Array(N + 1), A = new Float64Array(N + 1);
const SEG = new Uint8Array(N + 1), V = new Float64Array(N + 1), W = new Float64Array(N + 1);
const PH = new Float64Array(N + 1);
let NPH = 0;
(function sample() {
  let si = 0;
  for (let i = 0; i <= N; i++) {
    const t = Math.min(i * DT, T - 1e-9);
    while (si < plan.length - 1 && t >= plan[si].t0 + plan[si].dur) si++;
    const p = plan[si].f(t - plan[si].t0);
    X[i] = p.x; Y[i] = p.y; A[i] = p.a; SEG[i] = si;
  }
  for (let i = 0; i <= N; i++) {
    const a = (i - 1 + N) % N, b = (i + 1) % N;
    V[i] = Math.hypot(X[b] - X[a], Y[b] - Y[a]) / (2 * DT);
    W[i] = wrap(A[b] - A[a]) / (2 * DT);
  }
  // gait phase: stride frequency from speed and turning, freezing only with all six feet down
  const inWin = p => { const u = p - Math.floor(p); return (u >= 0.035 && u < 0.065) || (u >= 0.535 && u < 0.565); };
  const stride = v => clamp(0.5 + 0.09 * v, 0.55, 1.4);
  let p = 0.05;
  const lastSeg = plan[plan.length - 1];
  let pEnd = null, target = null;
  for (let i = 0; i < N; i++) {
    PH[i] = p;
    const seg = plan[SEG[i]];
    if (seg === lastSeg) {
      if (pEnd === null) { pEnd = p; target = Math.floor(pEnd) + 0.05; if (target < pEnd - 1e-9) target += 1; }
      const tau = (i + 1) * DT - seg.t0;
      p = pEnd + (target - pEnd) * sstep(tau / (seg.dur * 0.8));
      continue;
    }
    let f = Math.hypot(V[i] / stride(V[i]), Math.abs(W[i]) * 0.5);
    if (f < 0.35 || seg.b === "groom" || seg.b === "feed") f = 0;
    if (f < 1.2 && !inWin(p)) f = Math.max(f, 3.2);
    p += f * DT;
  }
  PH[N] = target;
  NPH = Math.round(target - 0.05);
})();

function idxOf(t) { let tm = t % T; if (tm < 0) tm += T; const f = tm / DT; const i = Math.min(N - 1, Math.floor(f)); return [i, f - i]; }
function poseAt(t) {
  const [i, f] = idxOf(t);
  return { x: lerp(X[i], X[i + 1], f), y: lerp(Y[i], Y[i + 1], f), a: A[i] + wrap(A[i + 1] - A[i]) * f };
}
function speedAt(t) { const [i, f] = idxOf(t); return lerp(V[i], V[i + 1], f); }
function segAt(t) { const [i] = idxOf(t); return plan[SEG[i]]; }
function phaseAt(t) {
  const K = Math.floor(t / T); const [i, f] = idxOf(t);
  return K * NPH + lerp(PH[i], PH[i + 1], f);
}
function timeAtPhase(p) {
  const K = Math.floor((p - PH[0]) / NPH);
  const q = p - K * NPH;
  let lo = 0, hi = N;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (PH[m] >= q) hi = m; else lo = m; }
  const fr = clamp((q - PH[lo]) / ((PH[hi] - PH[lo]) || 1), 0, 1);
  return K * T + (lo + fr) * DT;
}

/* ---------- legs ---------- */
const DUTY = 0.6;
const LEGS = [
  { id: "L1", hip: [0.40, -0.15], neu: [1.02, -0.60], len: [0.44, 0.43, 0.40], off: 0.03, front: true, wf: 0.072 },
  { id: "R1", hip: [0.40, 0.15], neu: [1.02, 0.60], len: [0.44, 0.43, 0.40], off: 0.53, front: true, wf: 0.072 },
  { id: "L2", hip: [0.15, -0.20], neu: [0.12, -1.12], len: [0.50, 0.53, 0.45], off: 0.50, wf: 0.064 },
  { id: "R2", hip: [0.15, 0.20], neu: [0.12, 1.12], len: [0.50, 0.53, 0.45], off: 0.00, wf: 0.064 },
  { id: "L3", hip: [-0.07, -0.18], neu: [-0.86, -0.96], len: [0.53, 0.55, 0.42], off: -0.03, wf: 0.068 },
  { id: "R3", hip: [-0.07, 0.18], neu: [-0.86, 0.96], len: [0.53, 0.55, 0.42], off: 0.47, wf: 0.068 },
];
LEGS.forEach((L, j) => {
  const r = mulberry(91 + j * 7);
  L.side = L.hip[1] < 0 ? -1 : 1;
  L.hairs = [];
  for (let s = 0; s < 2; s++) for (let k = 0; k < (s ? 9 : 7); k++) L.hairs.push({ seg: s, t: 0.12 + 0.8 * r(), side: r() < 0.5 ? -1 : 1, len: 0.025 + 0.025 * r(), ang: 0.3 + 0.25 * r() });
});
const tgtCache = new Map();
function toWorld(p, v) { const c = Math.cos(p.a), s = Math.sin(p.a); return { x: p.x + c * v[0] - s * v[1], y: p.y + s * v[0] + c * v[1] }; }
function target(j, k) {
  const key = j * 1e6 + k;
  let r = tgtCache.get(key);
  if (r) return r;
  const L = LEGS[j];
  const td = timeAtPhase(k + L.off), tm = timeAtPhase(k + L.off + DUTY / 2);
  r = toWorld(poseAt(Math.min(tm, td + 0.22)), L.neu);
  if (tgtCache.size > 4000) tgtCache.clear();
  tgtCache.set(key, r);
  return r;
}
function footWorld(j, phi) {
  const L = LEGS[j];
  const psi = phi - L.off, k = Math.floor(psi), u = psi - k;
  if (u < DUTY) { const a = target(j, k); return { x: a.x, y: a.y, lift: 0 }; }
  const s = (u - DUTY) / (1 - DUTY), a = target(j, k), b = target(j, k + 1), e = sstep(s);
  return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), lift: Math.sin(PI * s) };
}
function ik(hx, hy, ax, ay, l1, l2) {
  const dx = ax - hx, dy = ay - hy, D = Math.hypot(dx, dy) || 1e-6;
  const maxD = (l1 + l2) * 0.995;
  const s = D > maxD ? D / maxD : 1;
  const L1 = l1 * s, L2 = l2 * s;
  const Dc = clamp(D, Math.abs(L1 - L2) + 0.02, (L1 + L2) * 0.9999);
  const ux = dx / D, uy = dy / D;
  const ca = clamp((L1 * L1 + Dc * Dc - L2 * L2) / (2 * L1 * Dc), -1, 1), sa = Math.sqrt(1 - ca * ca);
  const k1 = [hx + L1 * (ux * ca - uy * sa), hy + L1 * (ux * sa + uy * ca)];
  const k2 = [hx + L1 * (ux * ca + uy * sa), hy + L1 * (-ux * sa + uy * ca)];
  return Math.abs(k1[1]) > Math.abs(k2[1]) ? k1 : k2;
}

/* ---------- story timing ---------- */
const segSniffA = plan.find(s => s.ev === "A"), segSniffB = plan.find(s => s.ev === "B");
const segFeed = plan.find(s => s.b === "feed"), segGroom = plan.find(s => s.b === "groom");
const segStartle = plan.find(s => s.k === "startle");
function qTimes(seg) {
  const ts = seg.t0, tq = ts + 0.45, arrive = tq + 0.32, res = arrive + 0.22, ret = res + 0.12, back = ret + 0.3;
  return { ts, local: ts + 0.22, tq, arrive, res, ret, back };
}
const QA = Object.assign(qTimes(segSniffA), {

/* ---------- layout ---------- */
function layout() {
  VW = Math.max(320, window.innerWidth); VH = Math.max(320, window.innerHeight);

  let H = VH, pw, ph, px, py;
  if (VW >= VH * 1.12 && VW >= 760) {
    pw = clamp(VW * 0.25, 280, 430);
    const cs = Math.max(240, Math.min(VH - 2 * m - capH, VW - pw - 3 * m));
    const x0 = Math.max(m, (VW - (cs + m + pw)) / 2);
    cam = { x: x0, y: m, s: cs };
    px = x0 + cs + m; py = m; ph = cs;
    caption.style.left = cam.x + "px"; caption.style.top = (cam.y + cs + 6) + "px";
  } else {
    const cs = Math.max(220, Math.min(VW - 2 * m, VH * 0.64));
    cam = { x: (VW - cs) / 2, y: m, s: cs };
    px = m; py = m + cs + m; pw = VW - 2 * m; ph = null;
  }
  const pf = clamp(Math.min(cam.s * 0.0148, pw * 0.042), 11, 17);
  document.documentElement.style.setProperty("--pf", pf + "px");
  Object.assign(panel.style, { left: px + "px", top: py + "px", width: pw + "px", height: ph === null ? "auto" : ph + "px" });
  document.getElementById("mapsec").style.flex = ph === null ? "none" : "";
  Object.assign(document.getElementById("map").style, ph === null ? { flex: "none", height: Math.round(pw * 0.55) + "px" } : { flex: "", height: "" });
  PORTRAIT = ph === null ? { py, m, capH } : null;
  if (ph === null) {
    ph = panel.offsetHeight;
    H = Math.max(VH, py + ph + m + capH);
    caption.style.left = m + "px"; caption.style.top = (py + ph + 6) + "px";
  }

  document.body.style.overflowY = H > VH ? "auto" : "hidden";
  cv.width = Math.round(VW * dpr); cv.height = Math.round(H * dpr);

/* ---------- drawing helpers ---------- */
const wx = x => cam.x + cam.s / 2 + x * S, wy = y => cam.y + cam.s / 2 + y * S;

const LC = { e: "rgba(58,40,22,0.95)", m: "#a27c4b", h: "#dcbb86", te: "rgba(52,36,18,0.95)", tm: "#8a6740", th: "#c49e6c" };

  if (part !== "distal") {
    taper(g, hx, hy, kx, ky, L.wf * 1.12, L.wf * 0.74, LC.e, LC.m, LC.h);
  }
  if (part !== "proximal") {
    taper(g, kx, ky, ax, ay, L.wf * 0.62, L.wf * 0.5, LC.e, LC.m, LC.h);

    }

}

/* ---------- behaviour sub-states ---------- */
// grooming: front legs rub and sweep the head, then the hind legs stroke the wings and abdomen
const GR = { sweep0: 0.9, sweep1: 1.5, frontOut: 1.75, hindIn: 1.95, hindOut: 2.62 };
function groomState(t) {
  const sg = segGroom; const tau = t - sg.t0;

  const w = sstep(tau / 0.28) * (1 - sstep((tau - GR.frontOut) / 0.3));
  const wh = sstep((tau - GR.hindIn) / 0.25) * (1 - sstep((tau - GR.hindOut) / 0.28));
  let mode = "rub";

}
function groomFoot(L, gs) {
  const s = L.side, tau = gs.tau;
  if (gs.mode === "rub") {
    const ph = tau * TAU * 4.2 + (s > 0 ? PI : 0);
    return [1.1 + 0.07 * Math.sin(ph), -s * 0.025 + 0.025 * Math.sin(ph * 2)];
  }
  const u = 0.5 - 0.5 * Math.cos((tau - GR.sweep0) * TAU * 2.5);
  return [lerp(1.08, 0.74, u), lerp(-s * 0.025, s * 0.2, u)];
}

  const s = L.side, k = (gs.tau - GR.hindIn) * TAU * 2.6;
  const u = 0.5 - 0.5 * Math.cos(k + (s > 0 ? 0.6 : 0));
  return [lerp(-1.05, -1.82, u), s * lerp(0.5, 0.1, u)];

/* ---------- the fly ---------- */
function drawFly(t, g, ox, oy) {
  const pose = poseAt(t), seg = segAt(t), v = speedAt(t), phi = phaseAt(t);
  const segTau = t - (Math.floor(t / T) * T) - seg.t0;
  const sway = 0.022 * Math.sin(TAU * phi) * clamp(v / 2.5, 0, 1);
  const th = pose.a + sway;
  const gs = groomState(((t % T) + T) % T);
  const feeding = seg.b === "feed" ? sstep(segTau / 0.3) * (1 - sstep((segTau - seg.dur + 0.3) / 0.3)) : 0;
  let headAng = 0;
  if (gs && gs.mode === "sweep") headAng = 0.1 * Math.sin((gs.tau - GR.sweep0) * TAU * 2.5) * gs.w;
  if (feeding) headAng = 0.03 * Math.sin(t * TAU * 1.6) * feeding;
  // wings
  let wingOpen = 0, buzz = 0;
  if (seg.k === "startle") {
    wingOpen = sstep(segTau / 0.05) * (1 - sstep((segTau - 0.28) / 0.12));
    buzz = wingOpen;
  }
  const cth = Math.cos(th), sth = Math.sin(th);
  // legs
  const G = LEGS.map((L, j) => {
    const fw = footWorld(j, phi);
    const dx = fw.x - pose.x, dy = fw.y - pose.y;
    let bx = dx * cth + dy * sth, by = -dx * sth + dy * cth, lift = fw.lift;
    if (gs && L.front && gs.w > 0) {
      const [gx, gy] = groomFoot(L, gs);
      bx = lerp(bx, gx, gs.w); by = lerp(by, gy, gs.w); lift = Math.max(lift, gs.w);
    }
    if (gs && L.id[1] === "3" && gs.wh > 0) {
      const [gx, gy] = hindGroomFoot(L, gs);
      bx = lerp(bx, gx, gs.wh); by = lerp(by, gy, gs.wh); lift = Math.max(lift, gs.wh * 1.4);
    }
    return { geom: legGeom(L, [bx, by]), lift };
  });

  g.save();
  g.translate(ox, oy);
  g.scale(S, S);
  // soft shadow (coaxial ring light: small offset, wide penumbra)
  g.save(); g.translate(0.035, 0.05); g.rotate(th); g.globalAlpha = 0.5; blit(g, SPR.shadow); g.restore();
  g.rotate(th);

  // leg shadows
  const shx = 0.035 * cth + 0.05 * sth, shy = -0.035 * sth + 0.05 * cth;
  for (const { geom: q, lift } of G) {
    const hts = [0.9, 1.4, 0.35 + lift * 0.9, lift * 1.1];
    const P = [[q.hx, q.hy], [q.kx, q.ky], [q.ax, q.ay], [q.fx, q.fy]].map(([x, y], k) => [x + shx * hts[k] * 1.6, y + shy * hts[k] * 1.6]);

    g.strokeStyle = "rgba(0,0,0,0.16)"; g.lineWidth = 0.1; g.stroke();
    g.strokeStyle = "rgba(0,0,0,0.22)"; g.lineWidth = 0.045; g.stroke();
  }
  // legs, hind first
  const sweeping = gs && gs.mode === "sweep" && gs.w > 0.5;
  const hindUp = gs && gs.wh > 0.35;
  for (const j of [4, 5, 2, 3, 0, 1]) drawLeg(g, LEGS[j], G[j].geom, (sweeping && LEGS[j].front) || (hindUp && j > 3) ? "proximal" : "all", j);

  blit(g, SPR.abdomen); g.restore();
  // wings
  const restA = 0.045;

    const drawW = (alpha, extra) => {
      g.save(); g.translate(0.17, s * 0.2);

    for (const s of [-1, 1]) {

      g.fillStyle = "#d4c3a0"; g.fill(); g.strokeStyle = "rgba(70,55,38,0.8)"; g.lineWidth = 0.008; g.stroke();
    }

  }
  g.save(); g.translate(0.58, 0); g.rotate(headAng); blit(g, SPR.head); g.restore();

let FLYC = null, FLYG = null;
function drawFlyComposite(t) {

/* ---------- plumes ---------- */

/* ---------- HUD ---------- */

function drawStaticHUD(t, info) {

function drawArenaHUD(t) {

}

      const dx = f.x - p.x, dy = f.y - p.y, bx = dx * c + dy * s, by = -dx * s + dy * c;
